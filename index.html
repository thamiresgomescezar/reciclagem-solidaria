<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Reciclagem Solidária</title>
  
  <!-- Configurações de PWA, Ícone e Nome do App -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="theme-color" content="#1b6d24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Reciclagem Solidária">
  <meta name="application-name" content="Reciclagem Solidária">

  <link rel="stylesheet" href="css/design-tokens.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #e3f4e2;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .splash {
      text-align: center;
      background: #e3f4e2;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
    }
    .splash img {
      max-width: 220px;
      height: auto;
      margin-bottom: 1.5rem;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .splash h1 {
      color: var(--verde-800, #2c5d2d);
      font-size: 1.85rem;
      font-weight: 800;
      margin: 0 0 0.5rem;
    }
    .splash p {
      color: var(--verde-700, #347535);
      font-weight: 600;
      margin-bottom: 2rem;
      font-size: 1rem;
    }
    .spinner-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--verde-700);
      font-weight: 700;
    }
    .spinner-icon {
      font-size: 1.75rem;
      color: var(--verde-600);
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="splash">
    <img src="assets/logo.jpg" alt="Reciclagem Solidária Logo">
    <h1>Reciclagem Solidária</h1>
    <p>Conectando cidadãos conscientes a catadores</p>
    <div class="spinner-container">
      <i class="fa-solid fa-circle-notch spinner-icon"></i>
      <span>Carregando...</span>
    </div>
  </div>

  <!-- SCRIPT SÍNCRONO IMEDIATO (Executa instantaneamente, independente de CDN, módulos ou rede) -->
  <script>
    (function() {
      // Se a URL contiver ?pause, ?preview ou ?print, congela a tela na splash para captura de tela / print
      var urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('pause') || urlParams.has('preview') || urlParams.has('print') || window.location.hash.indexOf('print') !== -1) {
        console.log('Modo de captura/print ativado: tela inicial pausada.');
        return;
      }

      var redirecionado = false;
      function navegar(url) {
        if (redirecionado) return;
        redirecionado = true;
        window.location.href = url;
      }

      // 1. TIMEOUT DE SEGURANÇA MÁXIMO (1.8s):
      // Garante que o usuário NUNCA fique preso na tela inicial, mesmo se o CDN falhar
      var timerGarantia = setTimeout(function() {
        navegar('./pages/login.html');
      }, 1800);

      // 2. VERIFICAÇÃO INSTANTÂNEA DE SESSÃO NO LOCALSTORAGE:
      var temSessao = false;
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('sb-') === 0 && k.indexOf('-auth-token') !== -1) {
            var val = localStorage.getItem(k);
            if (val && val.indexOf('access_token') !== -1) {
              temSessao = true;
              break;
            }
          }
        }
      } catch (e) {}

      // Se não há sessão salva, redireciona suavemente em 600ms direto para o login
      if (!temSessao) {
        setTimeout(function() {
          navegar('./pages/login.html');
        }, 600);
        return;
      }

      // Se há sessão e o tipo de usuário está em cache, encaminha diretamente para seu painel
      var tipoSalvo = null;
      try { tipoSalvo = localStorage.getItem('reciclagem_tipo_usuario'); } catch (e) {}
      if (tipoSalvo) {
        var rotas = {
          cidadao: './pages/dashboard-cidadao.html',
          administrador: './pages/dashboard-admin.html',
          catador: './pages/dashboard-catador.html'
        };
        if (rotas[tipoSalvo]) {
          setTimeout(function() {
            clearTimeout(timerGarantia);
            navegar(rotas[tipoSalvo]);
          }, 600);
        }
      }

      window.__cancelarGarantia = function() {
        clearTimeout(timerGarantia);
      };
      window.__navegarDireto = navegar;
    })();
  </script>

  <!-- VALIDAÇÃO ASSÍNCRONA COMPLETA COM SUPABASE -->
  <script type="module">
    import { supabase } from './js/lib/supabaseClient.js';
    import { getPerfilAtual } from './js/services/auth.js';

    async function validarESincronizar() {
      var urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('pause') || urlParams.has('preview') || urlParams.has('print') || window.location.hash.indexOf('print') !== -1) {
        return;
      }
      try {
        const { data } = await supabase.auth.getSession().catch(() => ({ data: { session: null } }));
        const session = data?.session;

        if (!session || !session.user) {
          if (window.__navegarDireto) window.__navegarDireto('./pages/login.html');
          return;
        }

        const perfil = await getPerfilAtual().catch(() => null);

        if (window.__cancelarGarantia) window.__cancelarGarantia();

        if (!perfil || perfil.erro || (perfil.dados && perfil.dados.situacao && perfil.dados.situacao !== 'ativo')) {
          try { await supabase.auth.signOut(); } catch (e) {}
          if (window.__navegarDireto) window.__navegarDireto('./pages/login.html');
          return;
        }

        const destinos = {
          cidadao: './pages/dashboard-cidadao.html',
          administrador: './pages/dashboard-admin.html',
          catador: './pages/dashboard-catador.html',
        };

        const rota = destinos[perfil.tipo] || './pages/login.html';
        if (window.__navegarDireto) window.__navegarDireto(rota);

      } catch (err) {
        console.warn('Falha na validação assíncrona:', err);
        if (window.__navegarDireto) window.__navegarDireto('./pages/login.html');
      }
    }

    validarESincronizar();
  </script>
</body>
</html>
