<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Cidadão Consciente</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Nunito', 'sans-serif'],
          },
          colors: {
            green: {
              400: '#7BCC7F',
              500: '#64B869',
              600: '#529E56',
              800: '#3D7940',
            }
          }
        }
      }
    }
  </script>
<style data-purpose="background-styles">
    body {
      background-color: #f5fbef;
    }
    .header-wave {
      background-color: #7BCC7F;
      border-bottom-left-radius: 50% 20%;
      border-bottom-right-radius: 50% 20%;
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center font-sans">
<!-- Mobile Container -->
<div class="w-full max-w-[414px] bg-transparent min-h-screen relative flex flex-col overflow-hidden shadow-2xl">
<!-- BEGIN: Header -->
<header class="header-wave text-white pt-2 pb-6 px-4 flex flex-col relative z-10" data-purpose="app-header">
<!-- Status Bar Placeholder -->
<div class="flex justify-between items-center w-full mb-2 text-xs font-semibold">
<div class="flex space-x-1 items-center">
<i class="fa-solid fa-signal"></i>
<i class="fa-solid fa-wifi"></i>
</div>
<div class="text-center flex flex-col">
<span class="text-lg leading-none">10:23</span>
<span class="text-[10px] leading-none">sábado</span>
</div>
<i class="fa-solid fa-battery-full"></i>
</div>
</header>
<!-- END: Header -->
<!-- BEGIN: Main Content -->
<main class="flex-grow flex flex-col items-center px-4 pt-6 pb-20 relative z-20" data-purpose="main-content">
<!-- Greeting Section -->
<section class="text-center mb-8" data-purpose="greeting">
<p class="text-green-800 text-sm font-semibold mb-1">Você está acessando como:</p>
<h1 class="text-green-600 text-2xl font-extrabold leading-tight tracking-tight mb-2">Cidadão Consciente</h1>
<p class="text-green-800 text-sm font-semibold">O que deseja realizar?</p>
</section>
<!-- Grid Menu -->
<section class="grid grid-cols-2 gap-4 w-full px-2 mb-4" data-purpose="menu-grid">
<!-- Card 1: Inserir material -->
<a class="bg-white rounded-3xl p-4 flex flex-col items-center justify-center shadow-md hover:shadow-lg transition-shadow aspect-square text-center" href="#">
<div class="w-16 h-16 mb-2 relative">
<i class="fa-solid fa-trash-can text-5xl text-green-600 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></i>
<div class="absolute bottom-0 right-0 bg-white rounded-full p-0.5">
<i class="fa-solid fa-circle-plus text-green-600 text-xl"></i>
</div>
</div>
<span class="text-green-800 text-xs font-bold leading-tight">Inserir material<br>para retirada</span>
</a>
<!-- Card 2: Editar material -->
<a class="bg-white rounded-3xl p-4 flex flex-col items-center justify-center shadow-md hover:shadow-lg transition-shadow aspect-square text-center" href="#">
<div class="w-16 h-16 mb-2 relative">
<i class="fa-solid fa-trash-can text-5xl text-green-600 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></i>
<div class="absolute bottom-0 right-0 bg-white rounded-full p-0.5">
<i class="fa-solid fa-arrows-rotate text-green-600 text-xl"></i>
</div>
</div>
<span class="text-green-800 text-xs font-bold leading-tight">Editar material<br>para retirada</span>
</a>
<!-- Card 3: Calendário -->
<a class="bg-white rounded-3xl p-4 flex flex-col items-center justify-center shadow-md hover:shadow-lg transition-shadow aspect-square text-center" href="#">
<div class="w-16 h-16 mb-2 relative flex items-center justify-center">
<i class="fa-regular fa-calendar-days text-5xl text-green-600"></i>
<div class="absolute bottom-0 right-0 bg-white rounded-full">
<i class="fa-solid fa-clock text-green-600 text-xl"></i>
</div>
</div>
<span class="text-green-800 text-xs font-bold leading-tight">Calendário<br>para retirada</span>
</a>
<!-- Card 4: Contatar Catador -->
<a class="bg-white rounded-3xl p-4 flex flex-col items-center justify-center shadow-md hover:shadow-lg transition-shadow aspect-square text-center" href="#">
<div class="w-16 h-16 mb-2 flex items-center justify-center relative">
<i class="fa-solid fa-comment text-5xl text-green-600"></i>
<i class="fa-solid fa-recycle text-white text-2xl absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></i>
</div>
<span class="text-green-800 text-xs font-bold leading-tight">Contatar<br>Catador</span>
</a>
</section>
<!-- Bottom Large Card: Rede Cadastrados -->
<section class="w-full px-2 flex justify-center" data-purpose="bottom-card">
<a class="bg-white rounded-3xl p-4 flex flex-col items-center justify-center shadow-md hover:shadow-lg transition-shadow w-[160px] aspect-square text-center" href="#">
<div class="w-20 h-20 mb-2 flex items-center justify-center">
<i class="fa-solid fa-network-wired text-5xl text-green-600"></i>
</div>
<span class="text-green-800 text-xs font-bold leading-tight">Rede<br>Cadastrados</span>
</a>
</section>
</main>
<!-- END: Main Content -->
<!-- BEGIN: Bottom Navigation -->
<footer class="bg-white w-full rounded-t-3xl shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] flex justify-around items-center py-4 px-6 fixed bottom-0 max-w-[414px]" data-purpose="bottom-nav">
<button class="text-green-600 focus:outline-none">
<i class="fa-solid fa-leaf text-3xl"></i>
</button>
<button class="text-green-600 focus:outline-none">
<i class="fa-solid fa-recycle text-4xl"></i>
</button>
<button class="text-green-600 focus:outline-none">
<i class="fa-solid fa-bars text-3xl"></i>
</button>
</footer>
<!-- END: Bottom Navigation -->
</div>
</body></html>
