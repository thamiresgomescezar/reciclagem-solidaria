<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            primary: {
              DEFAULT: '#4caf50',
              50: '#f5fbee',

<style data-purpose="layout">
body {
    background-color: #d6dcd0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 1rem;
}
.app-container {
    position: relative;
    width: 100%;
    max-width: 1200px;
    aspect-ratio: 16/10;
    background-color: white;
    border-radius: 0.5rem;
    overflow: hidden;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    display: flex;
    flex-direction: column;
}
/* Top Bar */
.top-bar {
    height: 40px;
    background: linear-gradient(to right, #e0e0e0, #888, #4caf50);
    display: flex;
    align-items: center;
    padding: 0 1rem;
    position: relative;
    z-index: 10;
}
.main-content {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
}
/* Slanted Background Split */
.bg-split {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    z-index: 0;
}
.bg-left {
    width: 75%;
    background-color: white;
    position: relative;
}
.bg-right {
    width: 25%;
    background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuARP3DiGwMHFARQlbQcKzE3_8fGUD-LnVqLsLjDzYI5ZjsYROBDZ1M35wxiRnFXuLF0ij5T0GqxFR2g0e6tL-mJBrNjed9fvsjI0utAbVJR_1Ic9rWIGvDVupv39fVSX81UCGKItvTzlkWKfNCiXqKeQnO-JyFw_xX_x1BA6u9zYb3GhSWpu9fhqdtupvdSidBjGP3lW5kxdX4YZqZsQf8AgFiv0NIKzuRb_OM651voqywwtWuksDnC7A');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    position: relative;
}
.bg-right::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: rgba(76, 175, 80, 0.7);
}
/* Content Overlay */
.content-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1;
    display: flex;
    padding: 2rem;
}
.left-panel {
    width: 30%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
}
/* Curved background for logo area */
.left-panel::before {
    content: "";
    position: absolute;
    top: -2rem;
    left: -2rem;
    bottom: -2rem;
    width: 120%;
    background-color: #e8f6df;
    border-radius: 0 50% 50% 0;
    z-index: -1;
}
.center-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 0 2rem;
}
.right-panel {
    width: 25%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding-bottom: 2rem;
}
/* Footer */
.bottom-bar {
    height: 50px;
    background-color: #2c5d2d;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 0 2rem;
    position: relative;
    z-index: 10;
}
/* Custom Input Buttons */
.btn-input {
    background-color: #4caf50;
    color: white;
    border-radius: 9999px;
    padding: 12px 24px;
    font-weight: 800;
    font-size: 1.1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 450px;
    margin-bottom: 16px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}
.btn-input span.small-text {
    font-size: 0.6rem;
    font-weight: 400;
    text-align: right;
    line-height: 1.2;
}
.action-btn {
    background-color: #4caf50;
    color: white;
    border-radius: 9999px;
    padding: 15px 40px;
    font-weight: 800;
    font-size: 1.2rem;
    text-align: center;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}
</style>
</head>

<div class="content-overlay">
<!-- BEGIN: LeftPanel -->

<div class="w-2.5 h-10 bg-red-500 rounded-full"></div>

<!-- Insert Image Section -->
<div class="flex items-center space-x-4 mt-6 mb-4 w-full">

<i class="fa-solid fa-camera"></i>
</div>
<button class="action-btn flex-grow">

            </button>
</div>
<!-- Image Placeholders -->
<div class="flex justify-center space-x-8 mb-8 w-full pl-16">
<div class="flex flex-col items-center">
<i class="fa-solid fa-recycle text-4xl text-primary-500 mb-1"></i>

</div>
<div class="flex flex-col items-center">

</div>
<div class="flex flex-col items-center">

<span class="text-xs text-gray-600 font-semibold">imagem3</span>

</div>
<!-- Define Agenda Button -->
<div class="flex items-center space-x-4 w-full">

</div>
<button class="action-btn flex-grow">

</div>
</div>
</div>
<!-- END: CenterPanel -->
<!-- BEGIN: RightPanel -->
<div class="right-panel">
<!-- Kept empty to let the background image shine, aligning with the clean layout structure -->
</div>
<!-- END: RightPanel -->
</div>
</div>
<!-- END: MainContent -->
<!-- BEGIN: BottomBar -->
<div class="bottom-bar">
</div>
<!-- END: BottomBar -->
</div>
<!-- END: AppContainer -->
</body></html>
