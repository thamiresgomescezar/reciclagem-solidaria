<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Coletas (Catador) — Reciclagem Solidária</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background-color: var(--verde-fundo-2);">

  <div class="mobile-view" style="max-width: 600px;">
    <div style="background-color: var(--verde-fundo-1); padding: 20px; text-align: center; border-bottom: 1px solid var(--cinza-borda);">
      <img src="../assets/prototypes/logo.jpg" alt="Logo" class="app-logo" style="max-width: 140px; margin-bottom: 8px;">
      <h3 style="color: var(--verde-escuro);">Minhas Coletas Agendadas</h3>
      <p style="font-size: 13px; color: var(--cinza-texto-aux);">Materiais sob sua responsabilidade de recolhimento</p>
    </div>

    <div class="mobile-content" style="justify-content: flex-start; padding-top: 16px;">
      <div id="feedback-msg" class="feedback-msg"></div>
      <div id="lista-minhas-coletas-catador" style="display: flex; flex-direction: column; gap: 14px;">
        <div style="text-align: center; padding: 40px; color: var(--cinza-texto-aux);">
          Carregando suas coletas agendadas...
        </div>
      </div>
    </div>

    <nav class="mobile-nav">
      <a href="./catador-materiais.html" class="mobile-nav-item">
        <span>♻️</span>
        <span style="font-size: 11px;">Ofertas</span>
      </a>
      <a href="./minhas-coletas-catador.html" class="mobile-nav-item" style="font-weight: bold;">
        <span></span>
        <span style="font-size: 11px;">Minhas Coletas</span>
      </a>
      <a href="#" id="btn-logout" class="mobile-nav-item">
        <span></span>
        <span style="font-size: 11px;">Sair</span>
      </a>
    </nav>
  </div>

  <script type="module">
    import { proibirAcessoInvalido } from '../js/lib/routeGuard.js';
    import { listarMinhasColetasCatador, cancelarAgendamento, resolverStatusColeta } from '../js/services/coletas.js';
    import { logout } from '../js/services/auth.js';
    import { showConfirmModal, showAlertModal } from '../js/lib/modal.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const perfil = await proibirAcessoInvalido(['catador', 'administrador']);
      if (!perfil) return;

      const listaContainer = document.getElementById('lista-minhas-coletas-catador');
      const feedbackMsg = document.getElementById('feedback-msg');
      const btnLogout = document.getElementById('btn-logout');

      if (btnLogout) {
        btnLogout.addEventListener('click', async (e) => {
          e.preventDefault();
          await logout();
          window.location.href = './login.html';
        });
      }

      async function carregarColetas() {
        try {
          const coletas = await listarMinhasColetasCatador();

          if (!coletas || coletas.length === 0) {
            listaContainer.innerHTML = `
              <div style="text-align: center; padding: 30px; background: white; border-radius: 16px; border: 1px dashed var(--cinza-borda);">
                <p style="font-size: 20px;"></p>
                <p style="font-weight: 600; color: var(--verde-escuro);">Você não possui coletas agendadas no momento</p>
                <p style="font-size: 13px; color: var(--cinza-texto-aux); margin-top: 4px;">Acesse a aba "Ofertas" para agendar a retirada de novos materiais.</p>
              </div>
            `;
            return;
          }

          listaContainer.innerHTML = '';
          coletas.forEach(coleta => {
            const card = document.createElement('div');
            card.style.cssText = `
              background: white;
              border-radius: 14px;
              padding: 16px;
              box-shadow: 0 2px 8px rgba(0,0,0,0.05);
              border: 1px solid var(--cinza-borda);
              display: flex;
              flex-direction: column;
              gap: 8px;
            `;

            const tipoMaterial = coleta.materiais?.tipo || 'Material';
            const doadorNome = coleta.cidadao?.nome || 'Cidadão';
            const doadorTel = coleta.cidadao?.telefone || 'Não informado';
            const statusInfo = resolverStatusColeta(coleta);
            const ehRetirada = statusInfo.ehRetirada;
            const ehCancelada = statusInfo.ehCancelada;
            const ehAgendada = statusInfo.ehAgendada;
            const statusNome = (statusInfo.rotulo || '')
              .replace(/RETIRADO/gi, 'RETIRADA')
              .replace(/CANCELADO/gi, 'CANCELADA')
              .replace(/REAGENDADO/gi, 'REAGENDADA')
              .replace(/AGENDADO/gi, 'AGENDADA');

            let dataHoraRetiradaFormatada = '';
            let dataHoraAgendadaFormatada = '';
            let dataHoraCanceladaFormatada = '';

            if (coleta.data) {
              const partesData = coleta.data.slice(0, 10).split('-');
              const dataPtBr = partesData.length === 3 ? `${partesData[2]}/${partesData[1]}/${partesData[0]}` : coleta.data;
              const horaPtBr = coleta.hora ? coleta.hora.slice(0, 5) : '';
              const strFormatada = horaPtBr ? `${dataPtBr} às ${horaPtBr}` : dataPtBr;
              dataHoraAgendadaFormatada = strFormatada;
              dataHoraRetiradaFormatada = strFormatada;
            }
            if (!dataHoraRetiradaFormatada && (coleta.atualizado_em || coleta.criado_em)) {
              const dt = new Date(coleta.atualizado_em || coleta.criado_em);
              if (!isNaN(dt.getTime())) {
                const dStr = String(dt.getDate()).padStart(2, '0') + '/' + String(dt.getMonth() + 1).padStart(2, '0') + '/' + dt.getFullYear();
                const hStr = String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0');
                dataHoraRetiradaFormatada = `${dStr} às ${hStr}`;
              }
            }
            if (coleta.atualizado_em || coleta.criado_em) {
              const dt = new Date(coleta.atualizado_em || coleta.criado_em);
              if (!isNaN(dt.getTime())) {
                const dStr = String(dt.getDate()).padStart(2, '0') + '/' + String(dt.getMonth() + 1).padStart(2, '0') + '/' + dt.getFullYear();
                const hStr = String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0');
                dataHoraCanceladaFormatada = `${dStr} às ${hStr}`;
              }
            }

            let badgeBg = '#fff3cd';
            let badgeCor = '#856404';
            if (ehRetirada) {
              badgeBg = '#e8f5e9';
              badgeCor = '#2e7d32';
            } else if (ehCancelada) {
              badgeBg = '#ffebee';
              badgeCor = '#c62828';
            }

            const dataCriacaoCat = coleta.criado_em ? new Date(coleta.criado_em).toLocaleDateString('pt-BR') : '';

            card.innerHTML = `
              <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px;">
                <div style="display: flex; flex-direction: column; gap: 2px;">
                  <strong style="color: var(--verde-escuro); font-size: 16px;">${tipoMaterial} (${coleta.quantidade})</strong>
                  ${dataCriacaoCat ? `<span style="font-size: 0.75rem; color: #666; font-weight: 600;"><i class="fa-regular fa-calendar" style="color: var(--verde-escuro);"></i> Criada em ${dataCriacaoCat}</span>` : ''}
                </div>
                <span style="font-size: 11px; font-weight: bold; background: ${badgeBg}; color: ${badgeCor}; padding: 4px 10px; border-radius: 12px; text-transform: uppercase;">
                  ${statusNome}
                </span>
              </div>

              <div style="font-size: 13px; color: var(--cinza-texto); background: #f9fbf9; padding: 10px; border-radius: 8px; margin-top: 4px; display: flex; flex-direction: column; gap: 4px;">
                <p style="margin: 0;"><strong>📍 Local:</strong> ${coleta.local_retirada?.nome || 'Fatec Franco da Rocha'}</p>
                <p style="margin: 0;"><strong>👤 Doador:</strong> ${doadorNome}</p>
                ${ehRetirada ? `
                  <div style="background: #e8f5e9; border: 1.5px solid #a5d6a7; border-radius: 8px; padding: 6px 10px; margin-top: 4px; display: flex; align-items: center; gap: 8px; color: #1b5e20; font-size: 0.85rem; font-weight: 700;">
                    <i class="fa-solid fa-circle-check" style="color: #2e7d32; font-size: 1.1rem;"></i>
                    <span><strong>Retirada em:</strong> <span style="color: #1b5e20; font-weight: 800;">${dataHoraRetiradaFormatada || 'Data registrada'}</span></span>
                  </div>
                ` : ehCancelada ? `
                  <div style="background: #fff5f5; border: 1.5px solid #ef9a9a; border-radius: 8px; padding: 6px 10px; margin-top: 4px; display: flex; align-items: center; gap: 8px; color: #c62828; font-size: 0.85rem; font-weight: 700;">
                    <i class="fa-solid fa-ban" style="color: #c62828; font-size: 1.1rem;"></i>
                    <span><strong>Cancelada em:</strong> <span style="color: #c62828; font-weight: 800;">${dataHoraCanceladaFormatada || 'Data arquivada'}</span></span>
                  </div>
                ` : `
                  <div style="background: #fff8e1; border: 1.5px solid #ffe082; border-radius: 8px; padding: 6px 10px; margin-top: 4px; display: flex; align-items: center; gap: 8px; color: #856404; font-size: 0.85rem; font-weight: 700;">
                    <i class="fa-regular fa-calendar-check" style="color: #b78103; font-size: 1.1rem;"></i>
                    <span><strong>Data Prevista para Retirada:</strong> <span style="color: #5d4037; font-weight: 800;">${dataHoraAgendadaFormatada || 'A combinar'}</span></span>
                  </div>
                `}
              </div>

              <div style="display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap;">
                <a href="./mensagens.html?coleta=${coleta.cod_coleta}" class="btn-coleta-secondary" style="text-align: center; flex: 1;">
                   <i class="fa-solid fa-comments"></i> Contatar Doador
                </a>
                ${ehAgendada ? `
                  <button type="button" class="btn-cancelar-agendamento-mob btn-coleta-danger" data-id="${coleta.cod_coleta}" style="flex: 1;">
                     <i class="fa-solid fa-calendar-xmark"></i> Cancelar Agendamento
                  </button>
                ` : ''}
              </div>
            `;

            listaContainer.appendChild(card);
          });

          document.querySelectorAll('.btn-cancelar-agendamento-mob').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const id = e.currentTarget.getAttribute('data-id');
              showConfirmModal({
                title: 'Cancelar Agendamento',
                message: 'Não conseguirá comparecer para retirar este material?\n\nAo cancelar seu agendamento, a coleta ficará disponível imediatamente para que outros catadores possam agendá-la.',
                confirmText: 'Sim, Cancelar Agendamento',
                cancelText: 'Voltar',
                confirmColor: '#c62828',
                onConfirm: async () => {
                  try {
                    await cancelarAgendamento(id);
                    if (feedbackMsg) {
                      feedbackMsg.textContent = 'Agendamento cancelado com sucesso. O material foi liberado para outros catadores.';
                      feedbackMsg.className = 'feedback-msg success';
                    }
                    await carregarColetas();
                  } catch (err) {
                    if (feedbackMsg) {
                      feedbackMsg.textContent = 'Erro ao cancelar agendamento: ' + err.message;
                      feedbackMsg.className = 'feedback-msg error';
                    }
                    if (err.message?.includes('RLS') || err.message?.includes('banco de dados')) {
                      showAlertModal({
                        title: 'Ação Bloqueada pelo Banco de Dados',
                        message: 'O Supabase não permitiu desvincular o material porque a regra de segurança (RLS) da tabela coleta não autoriza o Catador a atualizar registros.\n\nPara liberar essa ação, basta rodar o comando SQL de permissão no SQL Editor do Supabase.',
                        buttonText: 'Entendi'
                      });
                    }
                  }
                }
              });
            });
          });

        } catch (err) {
          console.error(err);
          listaContainer.innerHTML = `<div class="feedback-msg error">Erro ao carregar coletas agendadas.</div>`;
        }
      }

      await carregarColetas();
    });
  </script>
</body>
</html>
