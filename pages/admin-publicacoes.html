<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicações (Admin) — Reciclagem Solidária</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="web-container">
    <div class="web-panel-left">
      <button class="top-menu-btn" title="Menu">☰</button>

      <div style="margin-top: 40px; margin-bottom: 20px;">
        <img src="../assets/prototypes/logo.jpg" alt="Logo" class="app-logo" style="max-width: 180px;">
        <h3 style="color: var(--verde-escuro);">Gestão de Publicações & Campanhas</h3>
        <p style="color: var(--cinza-texto-aux); font-size: 14px;">Crie conteúdos educativos e institucionais para o portal.</p>
      </div>

      <div id="feedback-msg" class="feedback-msg"></div>

      <form id="publicacao-form" style="max-width: 550px; margin-bottom: 24px;">
        <div class="form-group">
          <label class="form-label" for="titulo">Título da Publicação</label>
          <input type="text" id="titulo" class="input-pill" placeholder="Ex: Dicas de Separação de Papel e Plástico" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="conteudo">Conteúdo</label>
          <textarea id="conteudo" class="input-pill" rows="4" style="border-radius: 16px; resize: vertical;" placeholder="Escreva o texto completo da publicação..." required></textarea>
        </div>

        <button type="submit" id="btn-publicar" class="btn-pill">PUBLICAR</button>
      </form>

      <h4 style="color: var(--verde-escuro); margin-bottom: 12px;">Publicações Ativas</h4>
      <div id="lista-publicacoes" style="display: flex; flex-direction: column; gap: 12px;">
        <div style="color: var(--cinza-texto-aux); font-size: 13px;">Carregando...</div>
      </div>

      <div style="margin-top: 24px; font-size: 14px;">
        <a href="#" id="btn-voltar" style="font-weight: bold; color: var(--verde-escuro);">← Voltar ao Dashboard Admin</a>
      </div>
    </div>

    <div class="web-panel-right"></div>
  </div>

  <script type="module" src="../js/lib/navMenu.js"></script>
  <script type="module">
    import { proibirAcessoInvalido, redirecionarPorPerfil } from '../js/lib/routeGuard.js';
    import { supabase } from '../js/lib/supabaseClient.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const perfil = await proibirAcessoInvalido(['administrador']);
      if (!perfil) return;

      const form = document.getElementById('publicacao-form');
      const inputTitulo = document.getElementById('titulo');
      const inputConteudo = document.getElementById('conteudo');
      const listaContainer = document.getElementById('lista-publicacoes');
      const feedbackMsg = document.getElementById('feedback-msg');
      const btnVoltar = document.getElementById('btn-voltar');

      btnVoltar.addEventListener('click', (e) => {
        e.preventDefault();
        redirecionarPorPerfil(perfil.tipo);
      });

      async function carregarPublicacoes() {
        const { data, error } = await supabase.from('publicacoes').select('*').order('criado_em', { ascending: false });
        if (error) {
          listaContainer.innerHTML = `<div class="feedback-msg error">Erro ao carregar publicações.</div>`;
          return;
        }

        if (!data || data.length === 0) {
          listaContainer.innerHTML = `<div style="color: var(--cinza-texto-aux); font-size: 13px;">Nenhuma publicação cadastrada.</div>`;
          return;
        }

        listaContainer.innerHTML = '';
        data.forEach(pub => {
          const div = document.createElement('div');
          div.style.cssText = 'background: white; padding: 14px; border-radius: 12px; border: 1px solid var(--cinza-borda); display: flex; flex-direction: column; gap: 6px;';
          div.innerHTML = `
            <strong style="color: var(--verde-escuro); font-size: 15px;">${pub.titulo}</strong>
            <p style="font-size: 13px; color: var(--cinza-texto); white-space: pre-wrap;">${pub.conteudo}</p>
            <div style="font-size: 11px; color: var(--cinza-texto-aux); margin-top: 4px;">Publicado em ${new Date(pub.criado_em).toLocaleDateString('pt-BR')}</div>
          `;
          listaContainer.appendChild(div);
        });
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          const { error } = await supabase.from('publicacoes').insert([{
            autor_id: perfil.user.id,
            titulo: inputTitulo.value.trim(),
            conteudo: inputConteudo.value.trim()
          }]);

          if (error) throw error;
          feedbackMsg.textContent = 'Publicação criada com sucesso!';
          feedbackMsg.className = 'feedback-msg success';
          form.reset();
          carregarPublicacoes();
        } catch (err) {
          feedbackMsg.textContent = err.message || 'Erro ao publicar.';
          feedbackMsg.className = 'feedback-msg error';
        }
      });

      await carregarPublicacoes();
    });
  </script>
</body>
</html>
