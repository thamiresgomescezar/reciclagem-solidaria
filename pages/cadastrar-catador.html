<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Catador — Reciclagem Solidária</title>
  <link rel="stylesheet" href="../css/design-tokens.css">
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Menu de Hambúrguer Fixo no Canto Superior Esquerdo -->
  <button type="button" class="top-menu-btn" id="btn_menu_drawer" aria-label="Abrir Menu Principal" title="Menu">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="web-container">
    <!-- Top Header -->
    <div class="top-bar">
      <div></div>
      <a href="#" id="btn-voltar-top" style="color: #ffffff !important; font-size: 0.85rem; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 4px;">
        <i class="fa-solid fa-arrow-left"></i> Voltar ao Painel
      </a>
    </div>

    <div class="main-content">
      <div class="bg-split">
        <div class="bg-left"></div>
        <div class="bg-right"></div>
      </div>

      <div class="content-overlay">
        <!-- 1/4 Esquerda: Logo e Navegação -->
        <aside class="left-panel">
          <div class="links">
            <a href="./cadastrar-catador.html" class="l1"><i class="fa-solid fa-user-plus"></i> Cadastrar Catador</a>
          </div>

          <div class="logo-wrap" style="margin-top: 0.5rem;">
            <img src="../assets/logo.jpg" alt="Logo Reciclagem Solidária" class="app-logo">
          </div>
        </aside>

        <!-- 2/4 Centro: Formulário de Cadastro por Terceiros Padronizado -->
        <main class="center-panel">
          <div style="max-width: 520px; width: 100%; margin: 0 auto; padding-bottom: 2rem;">
            <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--verde-escuro, #1b6d24); text-align: center; margin-bottom: 1rem;">
              Cadastrar Catador por Terceiros
            </h1>
            <p style="color: var(--cinza-texto-aux); font-size: 0.85rem; text-align: center; margin-bottom: 1.25rem;">
              Registre um catador autônomo para que ele possa receber agendamentos de coleta, mesmo sem possuir e-mail ou aplicativo.
            </p>

            <div id="feedback-msg" class="status-message" style="margin-bottom: 1.25rem;"></div>

            <form id="cadastrar-catador-form" novalidate>
              <div class="campo">
                <label for="nome">Nome do Catador:<span class="req">*</span></label>
                <input type="text" id="nome" class="input-underline" placeholder="Nome completo do catador" required>
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="campo">
                  <label for="telefone">Telefone / Contato:</label>
                  <input type="tel" id="telefone" class="input-underline" placeholder="(11) 90000-0000 (Opcional)">
                </div>
                <div class="campo">
                  <label for="email">E-mail (Opcional):</label>
                  <input type="email" id="email" class="input-underline" placeholder="catador@exemplo.com (Opcional)">
                </div>
              </div>

              <h4 style="color: var(--verde-escuro, #1b6d24); margin-top: 1rem; margin-bottom: 0.5rem; font-size: 1rem; font-weight: 800; border-bottom: 2px solid #a5d6a7; padding-bottom: 4px;">
                Endereço de Referência
              </h4>
              <div id="endereco-container"></div>

              <button type="submit" id="btn-salvar" class="btn-avancar" style="margin-top: 1.5rem;">
                <i class="fa-solid fa-user-check"></i> REGISTRAR CATADOR
              </button>
            </form>
          </div>
        </main>

        <!-- Right Panel -->
        <aside class="right-panel"></aside>
      </div>
    </div>
  </div>

  <script type="module" src="../js/lib/navMenu.js"></script>
  <script type="module" src="../js/pages/cadastrarCatador.js"></script>
  <script type="module">
    import { getPerfilAtual } from '../js/services/auth.js';
    document.addEventListener('DOMContentLoaded', async () => {
      const btnVoltarTop = document.getElementById('btn-voltar-top');
      const perfil = await getPerfilAtual();
      if (perfil?.tipo) {
        btnVoltarTop.href = perfil.tipo === 'administrador' ? './dashboard-admin.html' : (perfil.tipo === 'catador' ? './dashboard-catador.html' : './dashboard-cidadao.html');
      }
    });
  </script>
</body>
</html>
