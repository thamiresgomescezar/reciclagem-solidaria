<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Coletas — Reciclagem Solidária</title>
  <link rel="stylesheet" href="../css/design-tokens.css">
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Menu de Hambúrguer Fixo no Canto Superior Esquerdo -->
  <button type="button" class="top-menu-btn" id="btn_menu_drawer" aria-label="Abrir Menu Principal" title="Menu">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="web-container">
    <!-- Top Header -->
    <div class="top-bar">
      <div></div>
      <a href="./dashboard-admin.html" id="btn-voltar-top" style="color: #ffffff !important; font-size: 0.85rem; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 4px;">
        <i class="fa-solid fa-arrow-left"></i> Voltar ao Painel
      </a>
    </div>

    <div class="main-content">
      <div class="bg-split">
        <div class="bg-left"></div>
        <div class="bg-right"></div>
      </div>

      <div class="content-overlay">
        <!-- 1/4 Esquerda: Logo Fixo no Topo -->
        <aside class="left-panel">
          <div class="links" style="margin-bottom: 0.5rem;">
            <a href="./gestao-coletas.html" class="l1"><i class="fa-solid fa-recycle"></i> Gestão de Coletas</a>
          </div>

          <div class="logo-wrap" style="margin-top: 0.25rem;">
            <img src="../assets/logo.jpg" alt="Logo Reciclagem Solidária" class="app-logo">
          </div>
        </aside>

        <!-- 2/4 Centro: Painel de Gestão de Coletas -->
        <main class="center-panel">
          <div style="width: 100%; padding-bottom: 2rem;">
            <h1 style="font-size: 2rem; font-weight: 800; color: var(--verde-escuro, #1b6d24); text-align: center; margin-bottom: 0.5rem; margin-top: 0;">
              Gestão e Acompanhamento de Coletas
            </h1>
            <p style="font-size: 0.9rem; color: var(--cinza-texto-aux, #666); text-align: center; margin-bottom: 1.25rem;">
              Visão geral de ofertas e coletas do sistema. Edite informações, gerencie agendamentos e confirme retiradas.
            </p>

            <div id="statusMsg" class="status-message"></div>

            <!-- Barra Superior de Ações com Atalho para Gestão de Status -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
              <span style="font-size: 0.92rem; font-weight: 800; color: var(--verde-escuro, #1b6d24);">
                <i class="fa-solid fa-layer-group"></i> Painel Geral de Coletas
              </span>
              <a href="./gestao-status.html" class="btn-acao-secundaria" title="Personalizar status e regras de coleta">
                <i class="fa-solid fa-sliders"></i> Gerenciar Status
              </a>
            </div>

            <!-- Filtros de Status Padronizados Dinâmicos com Inicialização Instantânea -->
            <div id="filtros_coletas" class="filtros-coletas-grid">
              <button class="btn-tab active" data-status="todos" title="Todas"><i class="fa-solid fa-layer-group"></i> Todas</button>
              <button class="btn-tab" data-status="disponível" data-cor="verde" title="Disponíveis"><i class="fa-solid fa-clock"></i> Disponíveis</button>
              <button class="btn-tab" data-status="agendada" data-cor="amarelo" title="Agendadas"><i class="fa-solid fa-calendar-check"></i> Agendadas</button>
              <button class="btn-tab" data-status="reagendada" data-cor="amarelo" title="Reagendadas"><i class="fa-solid fa-calendar-days"></i> Reagendadas</button>
              <button class="btn-tab" data-status="retirada" data-cor="verde" title="Retiradas"><i class="fa-solid fa-circle-check"></i> Retiradas</button>
              <button class="btn-tab" data-status="cancelada" data-cor="vermelho" title="Canceladas"><i class="fa-solid fa-ban"></i> Canceladas</button>
            </div>
            <script>
              (function() {
                try {
                  var raw = localStorage.getItem('reciclagem_lista_status');
                  var container = document.getElementById('filtros_coletas');
                  if (raw && container) {
                    var list = JSON.parse(raw);
                    if (Array.isArray(list) && list.length > 0) {
                      var urlParams = new URLSearchParams(window.location.search);
                      var f = (urlParams.get('status') || 'todos').toLowerCase();
                      var h = '<button class="btn-tab ' + (f === 'todos' ? 'active' : '') + '" data-status="todos"><i class="fa-solid fa-layer-group"></i> Todas</button>';
                      list.forEach(function(st) {
                        var cod = st.cod_status;
                        var stNome = (st.status || '').toLowerCase().trim();
                        var regras = st.regras || {};
                        var icon = regras.icone;
                        var disp = st.status.charAt(0).toUpperCase() + st.status.slice(1);
                        var corId = (regras && regras.cor) ? regras.cor : (cod === 4 || cod === 5 || /cancel/i.test(stNome) ? 'vermelho' : /agend/i.test(stNome) ? 'amarelo' : 'verde');
                        if (/cancel/i.test(stNome) || cod === 4 || cod === 5) {
                          icon = 'fa-ban';
                          disp = 'Canceladas';
                        } else if (!icon) {
                          if (/(retirad|conclu)/i.test(stNome)) { icon = 'fa-circle-check'; disp = 'Retiradas'; }
                          else if (/reagend/i.test(stNome)) { icon = 'fa-calendar-days'; disp = 'Reagendadas'; }
                          else if (/agend/i.test(stNome)) { icon = 'fa-calendar-check'; disp = 'Agendadas'; }
                          else if (/dispon/i.test(stNome)) { icon = 'fa-box-open'; disp = 'Disponíveis'; }
                          else { icon = 'fa-tag'; }
                        } else {
                          if (/(retirad|conclu)/i.test(stNome)) disp = 'Retiradas';
                          else if (/reagend/i.test(stNome)) disp = 'Reagendadas';
                          else if (/agend/i.test(stNome)) disp = 'Agendadas';
                          else if (/dispon/i.test(stNome)) disp = 'Disponíveis';
                          else if (/cancel/i.test(stNome)) disp = 'Canceladas';
                        }
                        var active = (f === String(cod)) || (f === stNome) ||
                          (f === 'disponivel' && /dispon/i.test(stNome)) ||
                          (f === 'cancelada' && /cancel/i.test(stNome)) ||
                          (f === 'retirada' && /(retirad|conclu)/i.test(stNome)) ||
                          (f === 'agendada' && /agend/i.test(stNome));
                        h += '<button class="btn-tab ' + (active ? 'active' : '') + '" data-status="' + cod + '" data-cor="' + corId + '" title="' + disp + '"><i class="fa-solid ' + icon + '"></i> <span>' + disp + '</span></button>';
                      });
                      container.innerHTML = h;
                    }
                  }
                } catch(e) {}
              })();
            </script>

            <!-- Container Dinâmico da Lista de Coletas -->
            <div id="lista_coletas_container" style="display: flex; flex-direction: column; gap: 12px;">
              <div style="text-align: center; padding: 30px; color: var(--cinza-texto-aux);">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Carregando coletas...
              </div>
            </div>
          </div>
        </main>

        <!-- Right Panel -->
        <aside class="right-panel"></aside>
      </div>
    </div>
  </div>

  <script type="module" src="../js/lib/navMenu.js"></script>
  <script type="module">
    import { supabase } from '../js/lib/supabaseClient.js';
    import { protegerRota } from '../js/lib/routeGuard.js';
    import { getPerfilAtual } from '../js/services/auth.js';
    import { 
      listarTodasColetasAdmin, 
      listarCatadoresParaVincular, 
      vincularCatadorColeta, 
      getStatusDisponiveis, 
      getStatusDisponiveisCache,
      atualizarStatusColeta,
      atualizarColetaCompleta,
      listarLocaisRetirada,
      resolverStatusColeta 
    } from '../js/services/coletas.js';
    import { obterRegrasStatus, obterCoresStatus } from '../js/services/status.js';
    import { showConfirmModal, showAlertModal } from '../js/lib/modal.js';
    import { abrirModalEdicaoColeta, confirmarRetiradaComModal, abrirModalAtribuirCatador } from '../js/lib/modalColeta.js';

    const container = document.getElementById('lista_coletas_container');
    const statusMsg = document.getElementById('statusMsg');
    const btnVoltarTop = document.getElementById('btn-voltar-top');

    let perfilAtual = null;
    let todasColetasCarregadas = [];

    function sincronizarToolbarFiltros(listaStatus, filtroStatus = 'todos') {
      const toolbarFiltros = document.getElementById('filtros_coletas');
      if (!toolbarFiltros || !listaStatus || listaStatus.length === 0) return;

      const fNormalizado = (filtroStatus || 'todos').toLowerCase();
      let buttonsHtml = `
        <button class="btn-tab ${fNormalizado === 'todos' ? 'active' : ''}" data-status="todos">
          <i class="fa-solid fa-layer-group"></i> Todas
        </button>
      `;

      listaStatus.forEach(st => {
        const cod = st.cod_status;
        const stNomeLower = (st.status || '').toLowerCase().trim();
        const regras = st.regras || obterRegrasStatus(st.cod_status, st.status);
        let iconClass = regras.icone;
        let nomeDisplay = st.status.charAt(0).toUpperCase() + st.status.slice(1);

        if (/cancel/i.test(stNomeLower) || cod === 4 || cod === 5) {
          iconClass = 'fa-ban';
          nomeDisplay = 'Canceladas';
        } else if (!iconClass) {
          if (/(retirad|conclu)/i.test(stNomeLower)) {
            iconClass = 'fa-circle-check';
            nomeDisplay = 'Retiradas';
          } else if (/reagend/i.test(stNomeLower)) {
            iconClass = 'fa-calendar-days';
            nomeDisplay = 'Reagendadas';
          } else if (/agend/i.test(stNomeLower)) {
            iconClass = 'fa-calendar-check';
            nomeDisplay = 'Agendadas';
          } else if (/dispon/i.test(stNomeLower)) {
            iconClass = 'fa-box-open';
            nomeDisplay = 'Disponíveis';
          } else {
            iconClass = 'fa-tag';
          }
        } else {
          if (/(retirad|conclu)/i.test(stNomeLower)) nomeDisplay = 'Retiradas';
          else if (/reagend/i.test(stNomeLower)) nomeDisplay = 'Reagendadas';
          else if (/agend/i.test(stNomeLower)) nomeDisplay = 'Agendadas';
          else if (/dispon/i.test(stNomeLower)) nomeDisplay = 'Disponíveis';
          else if (/cancel/i.test(stNomeLower)) nomeDisplay = 'Canceladas';
        }

        const icon = `<i class="fa-solid ${iconClass}"></i>`;
        const ehAtivo = (fNormalizado === String(cod)) || (fNormalizado === stNomeLower) || 
          (fNormalizado === 'disponivel' && /dispon/i.test(stNomeLower)) ||
          (fNormalizado === 'cancelada' && /cancel/i.test(stNomeLower)) ||
          (fNormalizado === 'retirada' && /(retirad|conclu)/i.test(stNomeLower)) ||
          (fNormalizado === 'agendada' && /agend/i.test(stNomeLower));

        const temaCor = obterCoresStatus(cod, stNomeLower);
        const corId = (regras && regras.cor) ? regras.cor : (temaCor ? temaCor.id : 'verde');

        buttonsHtml += `
          <button class="btn-tab ${ehAtivo ? 'active' : ''}" data-status="${cod}" data-nome="${stNomeLower}" data-cor="${corId}" style="--cor-bg: ${temaCor.bg}; --cor-texto: ${temaCor.cor}; --cor-borda: ${temaCor.borda}; --cor-dot: ${temaCor.dot};" title="${nomeDisplay}">
            ${icon} <span>${nomeDisplay}</span>
          </button>
        `;
      });

      toolbarFiltros.innerHTML = buttonsHtml;

      toolbarFiltros.querySelectorAll('button').forEach(b => {
        b.onclick = () => {
          toolbarFiltros.querySelectorAll('button').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          carregarColetas(b.dataset.status);
        };
      });
    }

    async function carregarColetas(filtroStatus = 'todos') {
      try {
        container.innerHTML = `
          <div style="text-align: center; padding: 30px; color: var(--cinza-texto-aux);">
            <i class="fa-solid fa-circle-notch fa-spin"></i> Carregando coletas...
          </div>
        `;

        const [coletas, catadores, listaStatus, locaisRetirada] = await Promise.all([
          listarTodasColetasAdmin(filtroStatus).catch(() => []),
          listarCatadoresParaVincular().catch(() => []),
          getStatusDisponiveis().catch(() => []),
          listarLocaisRetirada().catch(() => [])
        ]);

        todasColetasCarregadas = coletas || [];
        if (Array.isArray(coletas)) {
          coletas.sort((a, b) => {
            const tA = a.interacao_timestamp || Math.max(new Date(a.atualizado_em || 0).getTime(), new Date(a.criado_em || 0).getTime());
            const tB = b.interacao_timestamp || Math.max(new Date(b.atualizado_em || 0).getTime(), new Date(b.criado_em || 0).getTime());
            return tB - tA;
          });
        }

        // Renderiza e sincroniza dinamicamente os botões da toolbar de filtros conforme os status cadastrados
        if (listaStatus && listaStatus.length > 0) {
          sincronizarToolbarFiltros(listaStatus, filtroStatus);
        } else {
          document.querySelectorAll('#filtros_coletas button').forEach(b => {
            const st = (b.dataset.status || '').toLowerCase();
            const fNormalizado = (filtroStatus || 'todos').toLowerCase();
            const ehAtivo = (st === fNormalizado) || (fNormalizado === 'todos' && (st === 'todos' || !st));
            if (ehAtivo) {
              b.classList.add('active');
            } else {
              b.classList.remove('active');
            }
          });
        }

        if (!coletas || coletas.length === 0) {
          container.innerHTML = `<div style="text-align: center; color: var(--cinza-texto-aux); padding: 24px; background: white; border-radius: 12px; border: 1px dashed rgba(0,0,0,0.1);">Nenhuma coleta encontrada para este filtro.</div>`;
          return;
        }

        const formatarDataHoraPtBr = (dataVal) => {
          if (!dataVal) return '';
          const dt = new Date(dataVal);
          if (isNaN(dt.getTime())) return '';
          const dia = String(dt.getDate()).padStart(2, '0');
          const mes = String(dt.getMonth() + 1).padStart(2, '0');
          const ano = dt.getFullYear();
          const hora = String(dt.getHours()).padStart(2, '0');
          const min = String(dt.getMinutes()).padStart(2, '0');
          return `${dia}/${mes}/${ano} às ${hora}:${min}`;
        };

        container.innerHTML = '';
        coletas.forEach(item => {
          const card = document.createElement('div');
          card.style.cssText = 'background: white; padding: 16px 20px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 3px 10px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 12px;';
          
          const matNome = item.materiais?.tipo || item.materiais?.nome || 'Material Reciclável';
          const cidNome = item.cidadao?.nome ? item.cidadao.nome : 'Nome não informado';
          const cidTel = item.cidadao?.telefone ? ` | <i class="fa-solid fa-phone" style="font-size: 10px;"></i> ${item.cidadao.telefone}` : '';
          const stNome = item.status?.status || item.status || 'disponível';
          const localNome = item.local_retirada?.nome || 'Fatec Franco da Rocha';

          const dataCriacao = item.criado_em ? new Date(item.criado_em) : null;
          const dataFormatada = dataCriacao && !isNaN(dataCriacao.getTime())
            ? dataCriacao.toLocaleDateString('pt-BR')
            : '';
          const criacaoFormatadaComHora = formatarDataHoraPtBr(item.criado_em);

          const tCriado = item.criado_em ? new Date(item.criado_em).getTime() : 0;
          const tAtualizado = item.atualizado_em ? new Date(item.atualizado_em).getTime() : 0;
          const tMsg = item.ultima_mensagem_em ? new Date(item.ultima_mensagem_em).getTime() : 0;

          const houveAtualizacao = tAtualizado > 0 && Math.abs(tAtualizado - tCriado) > 2000;
          const houveMensagemRecente = tMsg > 0 && (tMsg >= tAtualizado);

          // 1. Data e Horário para Agendada (Previsão combinada)
          let dataHoraAgendadaFormatada = '';
          if (item.data) {
            const partesData = item.data.slice(0, 10).split('-');
            const dataPtBr = partesData.length === 3 ? `${partesData[2]}/${partesData[1]}/${partesData[0]}` : item.data;
            const horaPtBr = item.hora ? item.hora.slice(0, 5) : '';
            dataHoraAgendadaFormatada = horaPtBr ? `${dataPtBr} às ${horaPtBr}` : dataPtBr;
          }

          // 2. Data e Horário para Retirada (Momento em que o material foi recolhido)
          let dataHoraRetiradaFormatada = '';
          if (item.data) {
            const partesData = item.data.slice(0, 10).split('-');
            const dataPtBr = partesData.length === 3 ? `${partesData[2]}/${partesData[1]}/${partesData[0]}` : item.data;
            const horaPtBr = item.hora ? item.hora.slice(0, 5) : '';
            dataHoraRetiradaFormatada = horaPtBr ? `${dataPtBr} às ${horaPtBr}` : dataPtBr;
          } else if (item.atualizado_em) {
            dataHoraRetiradaFormatada = formatarDataHoraPtBr(item.atualizado_em);
          } else if (item.criado_em) {
            dataHoraRetiradaFormatada = formatarDataHoraPtBr(item.criado_em);
          }

          // 3. Data e Horário para Cancelamento (Momento em que foi cancelada)
          let dataHoraCanceladaFormatada = '';
          if (item.atualizado_em) {
            dataHoraCanceladaFormatada = formatarDataHoraPtBr(item.atualizado_em);
          } else if (item.criado_em) {
            dataHoraCanceladaFormatada = formatarDataHoraPtBr(item.criado_em);
          }

          const catadorObj = catadores.find(c => c.id === item.catador_id);
          const catadorNome = catadorObj?.nome || item.catador?.nome || 'Nenhum (Disponível)';
          const catadorAuthId = item.catador?.auth_user_id || catadorObj?.auth_user_id || (item.catador?.id ? item.catador.id : null);

          const statusInfo = resolverStatusColeta(item);
          const ehRetirada = statusInfo.ehRetirada;
          const ehAgendada = statusInfo.ehAgendada;
          const ehCancelada = statusInfo.ehCancelada;
          const ehDisponivel = statusInfo.ehDisponivel;

          const temaCard = statusInfo.temaCor || { bg: '#f0fdf4', cor: '#166534', borda: '#bbf7d0', dot: '#16a34a' };
          const iconeCard = statusInfo.regras?.icone || (ehRetirada ? 'fa-circle-check' : ehAgendada ? 'fa-calendar-check' : ehCancelada ? 'fa-ban' : 'fa-clock');
          const rotuloCard = (statusInfo.rotulo || 'COLETA')
            .replace(/RETIRADO/gi, 'RETIRADA')
            .replace(/CANCELADO/gi, 'CANCELADA')
            .replace(/REAGENDADO/gi, 'REAGENDADA')
            .replace(/AGENDADO/gi, 'AGENDADA');
          const nomeCap = statusInfo.nome ? (statusInfo.nome.charAt(0).toUpperCase() + statusInfo.nome.slice(1)) : 'Status';

          let badgeBg = temaCard.bg;
          let badgeCor = temaCard.cor;
          let badgeBorda = temaCard.borda;
          let statusTextoDisplay = rotuloCard;

          const fotoTag = (item.foto_url && item.foto_url.trim() !== '')
            ? `<div style="position: relative; overflow: hidden; border-radius: 12px; background: #e8f5e9; border: 1.5px solid #a5d6a7; margin-top: 8px; margin-bottom: 2px;">
                <img src="${item.foto_url}" data-src="${item.foto_url}" alt="${matNome} (${item.quantidade || ''})" class="img-preview-material" style="width: 100%; height: 180px; object-fit: cover; border-radius: 10px; cursor: pointer; transition: transform 0.2s;" title="Clique para ampliar a foto">
                <div style="position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.7); color: #ffffff; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; pointer-events: none; display: flex; align-items: center; gap: 4px;">
                  <i class="fa-solid fa-magnifying-glass-plus"></i> Ampliar
                </div>
              </div>`
            : '';

          let tituloBanner = 'Coleta';
          if (ehRetirada || /retirad/i.test(statusInfo.nome)) tituloBanner = 'Coleta Retirada';
          else if (ehAgendada) tituloBanner = 'Coleta Agendada';
          else if (ehCancelada) tituloBanner = 'Coleta Cancelada';
          else if (ehDisponivel) tituloBanner = 'Oferta Disponível';
          else {
            const n = String(statusInfo.nome || '').trim().toLowerCase();
            if (n.endsWith('o')) {
              tituloBanner = 'Coleta ' + (n.charAt(0).toUpperCase() + n.slice(1, -1) + 'a');
            } else {
              tituloBanner = 'Coleta ' + nomeCap;
            }
          }

          let tagInteracaoHtml = '';
          if (houveMensagemRecente) {
            tagInteracaoHtml = `<span style="display: flex; align-items: center; gap: 5px; color: #6b7280;"><i class="fa-regular fa-comment-dots" style="color: #9ca3af;"></i> Mensagem em ${formatarDataHoraPtBr(item.ultima_mensagem_em)}</span>`;
          } else if (ehAgendada && houveAtualizacao) {
            tagInteracaoHtml = `<span style="display: flex; align-items: center; gap: 5px; color: #6b7280;"><i class="fa-regular fa-calendar-check" style="color: #9ca3af;"></i> Agendada em ${formatarDataHoraPtBr(item.atualizado_em)}</span>`;
          } else if (ehRetirada && houveAtualizacao) {
            tagInteracaoHtml = `<span style="display: flex; align-items: center; gap: 5px; color: #6b7280;"><i class="fa-solid fa-box-archive" style="color: #9ca3af;"></i> Retirada em ${formatarDataHoraPtBr(item.atualizado_em)}</span>`;
          } else if (ehCancelada && houveAtualizacao) {
            tagInteracaoHtml = `<span style="display: flex; align-items: center; gap: 5px; color: #6b7280;"><i class="fa-solid fa-ban" style="color: #9ca3af;"></i> Cancelada em ${formatarDataHoraPtBr(item.atualizado_em)}</span>`;
          } else if (houveAtualizacao) {
            tagInteracaoHtml = `<span style="display: flex; align-items: center; gap: 5px; color: #6b7280;"><i class="fa-solid fa-rotate" style="color: #9ca3af;"></i> Atualizada em ${formatarDataHoraPtBr(item.atualizado_em)}</span>`;
          }

          let bannerDataHoraHtml = '';
          if (ehRetirada || /retirad/i.test(statusInfo.nome)) {
            bannerDataHoraHtml = `
              <div style="background: ${temaCard.bg}; border: 1px solid ${temaCard.borda}; border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; margin-top: 4px;">
                <i class="fa-solid ${iconeCard}" style="color: ${temaCard.dot || temaCard.cor}; font-size: 1.15rem; flex-shrink: 0;"></i>
                <div style="display: flex; flex-direction: column; gap: 1px;">
                  <span style="font-size: 0.82rem; font-weight: 700; color: ${temaCard.cor};">${tituloBanner}</span>
                  <span style="font-size: 0.8rem; color: #4b5563;">Retirada confirmada</span>
                </div>
              </div>
            `;
          } else if (ehAgendada) {
            bannerDataHoraHtml = `
              <div style="background: ${temaCard.bg}; border: 1px solid ${temaCard.borda}; border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; margin-top: 4px;">
                <i class="fa-solid ${iconeCard}" style="color: ${temaCard.dot || temaCard.cor}; font-size: 1.15rem; flex-shrink: 0;"></i>
                <div style="display: flex; flex-direction: column; gap: 1px;">
                  <span style="font-size: 0.82rem; font-weight: 700; color: ${temaCard.cor};">${tituloBanner}</span>
                  <span style="font-size: 0.8rem; color: #57534e;">Data e horário previsto: <strong style="color: #1c1917; font-weight: 600;">${dataHoraAgendadaFormatada || 'A combinar'}</strong></span>
                </div>
              </div>
            `;
          } else if (ehCancelada) {
            bannerDataHoraHtml = `
              <div style="background: ${temaCard.bg}; border: 1px solid ${temaCard.borda}; border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; margin-top: 4px;">
                <i class="fa-solid ${iconeCard}" style="color: ${temaCard.dot || temaCard.cor}; font-size: 1.15rem; flex-shrink: 0;"></i>
                <div style="display: flex; flex-direction: column; gap: 1px;">
                  <span style="font-size: 0.82rem; font-weight: 700; color: ${temaCard.cor};">${tituloBanner}</span>
                  <span style="font-size: 0.8rem; color: #4b5563;">Coleta cancelada</span>
                </div>
              </div>
            `;
          } else {
            bannerDataHoraHtml = `
              <div style="background: ${temaCard.bg}; border: 1.5px dashed ${temaCard.borda}; border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; margin-top: 4px;">
                <i class="fa-solid ${iconeCard}" style="color: ${temaCard.dot || temaCard.cor}; font-size: 1.15rem; flex-shrink: 0;"></i>
                <div style="display: flex; flex-direction: column; gap: 1px;">
                  <span style="font-size: 0.84rem; font-weight: 800; color: ${temaCard.cor};">${tituloBanner}</span>
                  <span style="font-size: 0.8rem; color: ${temaCard.cor}; opacity: 0.9; font-weight: 500;">Aguardando atribuição de catador e agendamento da retirada</span>
                </div>
              </div>
            `;
          }


          let acoesAdminHtml = `
            ${statusInfo.bloquearDados ? `
              <div class="card-coleta-finalizada">
                <div class="acoes-finalizadas-botoes">
                  <button type="button" class="btn-editar-coleta btn-coleta-secondary" data-id="${item.cod_coleta || item.id}">
                    <i class="fa-solid fa-eye"></i> Ver Detalhes
                  </button>
                  ${catadorAuthId ? `
                    <a href="./mensagens.html?destinatario=${catadorAuthId}&coleta=${item.cod_coleta || item.id}" class="btn-coleta-secondary">
                      <i class="fa-solid fa-comments"></i> Conversar
                    </a>
                  ` : ''}
                </div>
              </div>
            ` : (statusInfo.requerCatador || ehAgendada) ? `
              <div class="card-coleta-acoes">
                <button type="button" class="btn-confirmar-retirada btn-coleta-primary btn-acao-destaque" data-id="${item.cod_coleta || item.id}" data-catador="${item.catador_id || ''}">
                  <i class="fa-solid fa-circle-check"></i> Confirmar Retirada
                </button>
                <div class="acoes-linha-botoes">
                  <button type="button" class="btn-atribuir-catador btn-coleta-secondary btn-acao-larga" data-id="${item.cod_coleta || item.id}">
                    <i class="fa-solid fa-calendar-days"></i> Reagendar / Trocar Catador
                  </button>
                  <div class="acoes-sublinha-dupla">
                    <button type="button" class="btn-editar-coleta btn-coleta-secondary" data-id="${item.cod_coleta || item.id}">
                      <i class="fa-solid fa-pen-to-square"></i> Editar Dados
                    </button>
                    ${catadorAuthId ? `
                      <a href="./mensagens.html?destinatario=${catadorAuthId}&coleta=${item.cod_coleta || item.id}" class="btn-coleta-secondary">
                        <i class="fa-solid fa-comments"></i> Conversar
                      </a>
                    ` : ''}
                  </div>
                </div>
              </div>
            ` : `
              <!-- Disponível / Aberta -->
              <div class="card-coleta-acoes">
                <div class="acoes-linha-botoes">
                  <button type="button" class="btn-atribuir-catador btn-coleta-primary btn-acao-larga" data-id="${item.cod_coleta || item.id}">
                    <i class="fa-solid fa-user-plus"></i> Atribuir Catador / Agendar
                  </button>
                  <div class="acoes-sublinha-dupla">
                    <button type="button" class="btn-editar-coleta btn-coleta-secondary" data-id="${item.cod_coleta || item.id}">
                      <i class="fa-solid fa-pen-to-square"></i> Editar Dados
                    </button>
                    ${catadorAuthId ? `
                      <a href="./mensagens.html?destinatario=${catadorAuthId}&coleta=${item.cod_coleta || item.id}" class="btn-coleta-secondary">
                        <i class="fa-solid fa-comments"></i> Conversar
                      </a>
                    ` : ''}
                  </div>
                </div>
              </div>
            `}
          `;

          card.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px;">
              <div style="display: flex; flex-direction: column; gap: 3px;">
                <strong style="color: var(--verde-escuro, #1b6d24); font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 6px;">
                  <i class="fa-solid fa-recycle" style="color: var(--verde-escuro, #1b6d24);"></i> ${matNome} — ${item.quantidade || 'Qtd não informada'}
                </strong>
                <div style="font-size: 0.76rem; color: #6b7280; font-weight: 500; display: flex; flex-direction: column; gap: 2px;">
                  <span style="display: flex; align-items: center; gap: 5px;"><i class="fa-regular fa-calendar" style="color: #9ca3af;"></i> Criada em ${criacaoFormatadaComHora || 'Data recente'}</span>
                  ${tagInteracaoHtml}
                </div>
              </div>
              <span style="font-size: 0.72rem; font-weight: 700; background: ${badgeBg}; color: ${badgeCor}; border: 1px solid ${badgeBorda}; padding: 3px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.04em;">
                ${statusTextoDisplay}
              </span>
            </div>

            <div style="display: flex; flex-direction: column; gap: 6px; font-size: 0.86rem; color: #374151; padding: 2px 0;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; flex-shrink: 0; color: var(--verde-escuro, #1b6d24);">
                  <i class="fa-solid fa-location-dot" style="font-size: 0.95rem;"></i>
                </span>
                <span style="color: #4b5563; font-weight: 600;">Ponto de Retirada:</span>
                <span style="color: #111827; font-weight: 600;">${localNome}</span>
              </div>

              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; flex-shrink: 0; color: var(--verde-escuro, #1b6d24);">
                  <i class="fa-solid fa-user" style="font-size: 0.95rem;"></i>
                </span>
                <span style="color: #4b5563; font-weight: 600;">Ofertante:</span>
                <span style="color: #111827; font-weight: 600;">${cidNome}${cidTel}</span>
              </div>

              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; flex-shrink: 0; color: var(--verde-escuro, #1b6d24);">
                  <i class="fa-solid fa-user-check" style="font-size: 0.95rem;"></i>
                </span>
                <span style="color: #4b5563; font-weight: 600;">Catador Atribuído:</span>
                <span style="color: ${item.catador_id ? '#111827' : '#9ca3af'}; font-weight: ${item.catador_id ? '600' : '500'};">
                  ${item.catador_id ? catadorNome : 'Nenhum catador atribuído'}
                </span>
              </div>

              ${bannerDataHoraHtml}
            </div>

            ${fotoTag}

            ${acoesAdminHtml}
          `;
          container.appendChild(card);
        });

        document.querySelectorAll('.img-preview-material').forEach(img => {
          img.addEventListener('click', (e) => {
            const src = e.currentTarget.getAttribute('data-src') || e.currentTarget.src;
            const alt = e.currentTarget.getAttribute('alt');
            abrirModalFoto(src, alt);
          });
        });

        // 1. Confirmar Retirada com Modal
        document.querySelectorAll('.btn-confirmar-retirada').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = e.currentTarget.getAttribute('data-id');
            const catId = e.currentTarget.getAttribute('data-catador');
            const coletaAlvo = todasColetasCarregadas.find(c => (c.cod_coleta || c.id) === id);

            confirmarRetiradaComModal({
              coleta: coletaAlvo,
              cod_coleta: id,
              catador_id: catId,
              material: coletaAlvo?.materiais?.tipo || coletaAlvo?.materiais?.nome,
              quantidade: coletaAlvo?.quantidade,
              onConfirmada: (msg, infoStatus) => {
                statusMsg.className = 'status-message success';
                statusMsg.textContent = msg;
                const statusDestino = (infoStatus && infoStatus.cod_status) ? String(infoStatus.cod_status) : '3';
                carregarColetas(statusDestino);
              }
            });
          });
        });

        // 2. Editar Informações com Modal Completo
        document.querySelectorAll('.btn-editar-coleta').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = e.currentTarget.getAttribute('data-id');
            const coletaAlvo = todasColetasCarregadas.find(c => (c.cod_coleta || c.id) === id);

            if (!coletaAlvo) {
              statusMsg.className = 'status-message error';
              statusMsg.textContent = 'Coleta não localizada para edição.';
              return;
            }

            abrirModalEdicaoColeta({
              coleta: coletaAlvo,
              catadores,
              listaStatus,
              locaisRetirada,
              ehAdmin: true,
              onSalvar: (msg, infoStatus) => {
                statusMsg.className = 'status-message success';
                statusMsg.textContent = msg;
                const statusDestino = (infoStatus && (infoStatus.cod_status || infoStatus.nome_status))
                  ? String(infoStatus.cod_status || infoStatus.nome_status)
                  : filtroStatus;
                carregarColetas(statusDestino);
              }
            });
          });
        });

        // 3. Atribuir Catador / Agendar Coleta com Escolha Explícita de Data e Horário
        document.querySelectorAll('.btn-atribuir-catador').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = e.currentTarget.getAttribute('data-id');
            const coletaAlvo = todasColetasCarregadas.find(c => (c.cod_coleta || c.id) === id);

            if (!coletaAlvo) {
              statusMsg.className = 'status-message error';
              statusMsg.textContent = 'Coleta não localizada para agendamento.';
              return;
            }

            abrirModalAtribuirCatador({
              coleta: coletaAlvo,
              catadores,
              onSalvar: (msg, infoStatus) => {
                statusMsg.className = 'status-message success';
                statusMsg.textContent = msg;
                const statusDestino = (infoStatus && infoStatus.cod_status) ? String(infoStatus.cod_status) : '2';
                carregarColetas(statusDestino);
              }
            });
          });
        });
      } catch (err) {
        console.error('Erro ao carregar coletas:', err);
        container.innerHTML = `<div class="status-message error">Erro ao carregar coletas: ${err.message}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (btnVoltarTop) {
        btnVoltarTop.addEventListener('click', (e) => {
          e.preventDefault();
          window.location.href = './dashboard-admin.html';
        });
      }

      const urlParams = new URLSearchParams(window.location.search);
      const statusParam = urlParams.get('status') || 'todos';

      // 1. Sincronização INSTANTÂNEA dos filtros via cache (0ms - exibe todos os status novos imediatamente)
      const statusEmCache = getStatusDisponiveisCache();
      if (statusEmCache && statusEmCache.length > 0) {
        sincronizarToolbarFiltros(statusEmCache, statusParam);
      } else {
        document.querySelectorAll('#filtros_coletas button').forEach(b => {
          b.addEventListener('click', () => {
            document.querySelectorAll('#filtros_coletas button').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            carregarColetas(b.dataset.status);
          });
        });
      }

      // 2. Busca lista fresca de status em paralelo no Supabase (não trava a interface nem espera as coletas)
      getStatusDisponiveis().then(statusFrescos => {
        if (statusFrescos && statusFrescos.length > 0) {
          const btnAtivo = document.querySelector('#filtros_coletas button.active');
          const stAtivo = btnAtivo ? (btnAtivo.dataset.status || statusParam) : statusParam;
          sincronizarToolbarFiltros(statusFrescos, stAtivo);
        }
      });

      const perfilLogado = await getPerfilAtual().catch(() => null);
      if (perfilLogado && perfilLogado.tipo === 'cidadao') {
        window.location.href = './minhas-ofertas.html';
        return;
      }

      const acesso = await protegerRota(['administrador']).catch(() => ({ permitido: false }));
      if (acesso && acesso.permitido) {
        perfilAtual = acesso.perfil;
      }

      await carregarColetas(statusParam);
    });

    function abrirModalFoto(url, titulo) {
      let modal = document.getElementById('modal-foto-preview');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'modal-foto-preview';
        modal.style.cssText = 'position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px;';
        modal.innerHTML = `
          <div style="position: relative; max-width: 90vw; max-height: 90vh; display: flex; flex-direction: column; align-items: center;">
            <button id="btn-fechar-foto-modal" style="position: absolute; top: -45px; right: 0; background: none; border: none; color: #ffffff; font-size: 1.8rem; cursor: pointer; padding: 8px;">
              <i class="fa-solid fa-xmark"></i>
            </button>
            <img id="img-modal-full" src="" alt="Foto do Material" style="max-width: 100%; max-height: 80vh; object-fit: contain; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <span id="txt-modal-titulo" style="color: #ffffff; margin-top: 12px; font-weight: 700; font-size: 1rem; text-align: center;"></span>
          </div>
        `;
        document.body.appendChild(modal);

        modal.addEventListener('click', (e) => {
          if (e.target === modal || e.target.closest('#btn-fechar-foto-modal')) {
            modal.style.display = 'none';
          }
        });
      }

      const imgFull = modal.querySelector('#img-modal-full');
      const txtTitulo = modal.querySelector('#txt-modal-titulo');
      if (imgFull) imgFull.src = url;
      if (txtTitulo) txtTitulo.textContent = titulo || 'Material Reciclável';
      modal.style.display = 'flex';
    }
  </script>
</body>
</html>
