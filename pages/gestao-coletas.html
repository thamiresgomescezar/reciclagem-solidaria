<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Coletas — Reciclagem Solidária</title>
  <link rel="stylesheet" href="../css/design-tokens.css">
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Menu de Hambúrguer Fixo no Canto Superior Esquerdo -->
  <button type="button" class="top-menu-btn" id="btn_menu_drawer" aria-label="Abrir Menu Principal" title="Menu">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="web-container">
    <!-- Top Header -->
    <div class="top-bar">
      <div></div>
      <a href="./dashboard-admin.html" id="btn-voltar-top" style="color: #ffffff !important; font-size: 0.85rem; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 4px;">
        <i class="fa-solid fa-arrow-left"></i> Voltar ao Painel
      </a>
    </div>

    <div class="main-content">
      <div class="bg-split">
        <div class="bg-left"></div>
        <div class="bg-right"></div>
      </div>

      <div class="content-overlay">
        <!-- 1/4 Esquerda: Logo Fixo no Topo -->
        <aside class="left-panel">
          <div class="links" style="margin-bottom: 0.5rem;">
            <a href="./gestao-coletas.html" class="l1"><i class="fa-solid fa-recycle"></i> Gestão de Coletas</a>
          </div>

          <div class="logo-wrap" style="margin-top: 0.25rem;">
            <img src="../assets/logo.jpg" alt="Logo Reciclagem Solidária" class="app-logo">
          </div>
        </aside>

        <!-- 2/4 Centro: Painel de Gestão de Coletas -->
        <main class="center-panel">
          <div style="width: 100%; padding-bottom: 2rem;">
            <h1 style="font-size: 2rem; font-weight: 800; color: var(--verde-escuro, #1b6d24); text-align: center; margin-bottom: 1.25rem; margin-top: 0;">
              Gestão e Acompanhamento de Coletas
            </h1>

            <div id="statusMsg" class="status-message"></div>

            <!-- Filtros de Status Padronizados Com Aba 'Canceladas' Incluída -->
            <div style="display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;" id="filtros_coletas">
              <button class="btn-tab active" data-status="todos"><i class="fa-solid fa-layer-group"></i> Todas</button>
              <button class="btn-tab" data-status="disponível"><i class="fa-solid fa-clock"></i> Disponíveis</button>
              <button class="btn-tab" data-status="agendado"><i class="fa-solid fa-calendar-check"></i> Agendadas</button>
              <button class="btn-tab" data-status="retirado"><i class="fa-solid fa-circle-check"></i> Concluídas</button>
              <button class="btn-tab" data-status="cancelado"><i class="fa-solid fa-ban"></i> Canceladas</button>
            </div>

            <!-- Container Dinâmico da Lista de Coletas -->
            <div id="lista_coletas_container" style="display: flex; flex-direction: column; gap: 12px;">
              <div style="text-align: center; padding: 30px; color: var(--cinza-texto-aux);">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Carregando coletas...
              </div>
            </div>
          </div>
        </main>

        <!-- Right Panel -->
        <aside class="right-panel"></aside>
      </div>
    </div>
  </div>

  <script type="module" src="../js/lib/navMenu.js"></script>
  <script type="module">
    import { supabase } from '../js/lib/supabaseClient.js';
    import { protegerRota } from '../js/lib/routeGuard.js';
    import { getPerfilAtual } from '../js/services/auth.js';
    import { listarTodasColetasAdmin, listarCatadoresParaVincular, vincularCatadorColeta, getStatusDisponiveis } from '../js/services/coletas.js';

    const container = document.getElementById('lista_coletas_container');
    const statusMsg = document.getElementById('statusMsg');
    const btnVoltarTop = document.getElementById('btn-voltar-top');

    let perfilAtual = null;

    async function carregarColetas(filtroStatus = 'todos') {
      try {
        const [coletas, catadores, listaStatus] = await Promise.all([
          listarTodasColetasAdmin(filtroStatus).catch(() => []),
          listarCatadoresParaVincular().catch(() => []),
          getStatusDisponiveis().catch(() => [])
        ]);

        if (!coletas || coletas.length === 0) {
          container.innerHTML = `<div style="text-align: center; color: var(--cinza-texto-aux); padding: 24px; background: white; border-radius: 12px; border: 1px dashed rgba(0,0,0,0.1);">Nenhuma coleta encontrada para este filtro.</div>`;
          return;
        }

        container.innerHTML = '';
        coletas.forEach(item => {
          const card = document.createElement('div');
          card.style.cssText = 'background: white; padding: 16px 20px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 3px 10px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 12px;';
          
          const matNome = item.materiais?.tipo || item.materiais?.nome || 'Material Reciclável';
          const cidNome = item.cidadao?.nome ? item.cidadao.nome : 'Nome não informado';
          const cidTel = item.cidadao?.telefone ? ` | <i class="fa-solid fa-phone" style="font-size: 10px;"></i> ${item.cidadao.telefone}` : '';
          const stNome = item.status?.status || item.status || 'disponível';
          const localNome = item.local_retirada?.nome || 'Fatec Franco da Rocha';

          // Regra: Só permite alocar/alterar o catador se o status for 'disponível' (cod_status === 1)
          const podeAlocarCatador = (stNome === 'disponível' || item.cod_status === 1);
          const disabledCatador = podeAlocarCatador ? '' : 'disabled';
          const styleCatador = podeAlocarCatador 
            ? 'background: transparent; cursor: pointer;' 
            : 'background: #f5f5f5; color: #777; cursor: not-allowed; opacity: 0.8;';

          let fraseBloqueio = '';
          if (!podeAlocarCatador) {
            if (stNome === 'cancelado' || item.cod_status === 5) {
              fraseBloqueio = 'Alterações não permitidas para coletas canceladas';
            } else if (stNome === 'agendado' || item.cod_status === 2) {
              fraseBloqueio = 'Alterações não permitidas para coletas agendadas';
            } else if (stNome === 'retirado' || stNome === 'concluído' || item.cod_status === 3 || item.cod_status === 4) {
              fraseBloqueio = 'Alterações não permitidas para coletas retiradas';
            } else {
              fraseBloqueio = `Alterações não permitidas para coletas ${stNome}s`;
            }
          }

          let catadorOptionsHtml = `<option value="">-- Sem Catador (Disponível) --</option>`;
          catadores.forEach(cat => {
            const isSelected = item.catador_id === cat.id ? 'selected' : '';
            catadorOptionsHtml += `<option value="${cat.id}" ${isSelected}>${cat.nome}</option>`;
          });

          let statusOptionsHtml = '';
          if (listaStatus && listaStatus.length > 0) {
            listaStatus.forEach(st => {
              const isSelected = (item.cod_status === st.cod_status) || (stNome.toLowerCase() === (st.status || '').toLowerCase());
              const nomeCapitalizado = (st.status || '').charAt(0).toUpperCase() + (st.status || '').slice(1);
              statusOptionsHtml += `<option value="${st.cod_status}" ${isSelected ? 'selected' : ''}>${nomeCapitalizado}</option>`;
            });
          } else {
            statusOptionsHtml = `
              <option value="1" ${stNome === 'disponível' ? 'selected' : ''}>Disponível</option>
              <option value="2" ${stNome === 'agendado' ? 'selected' : ''}>Agendado</option>
              <option value="3" ${stNome === 'retirado' ? 'selected' : ''}>Retirado (Concluído)</option>
            `;
          }

          const fotoTag = (item.foto_url && item.foto_url.trim() !== '')
            ? `<div style="position: relative; overflow: hidden; border-radius: 12px; margin-bottom: 6px; background: #e8f5e9; border: 1.5px solid #a5d6a7;">
                <img src="${item.foto_url}" data-src="${item.foto_url}" alt="${matNome} (${item.quantidade || ''})" class="img-preview-material" style="width: 100%; height: 170px; object-fit: cover; border-radius: 10px; cursor: pointer; transition: transform 0.2s;" title="Clique para ampliar a foto do material" onerror="this.parentElement.innerHTML='<div style=\\'padding: 10px; text-align: center; color: #666; font-size: 0.8rem;\\'><i class=\\'fa-regular fa-image\\'></i> Imagem não disponível</div>';">
                <div style="position: absolute; top: 6px; left: 6px; background: rgba(27,109,36,0.85); color: #ffffff; padding: 3px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; display: flex; align-items: center; gap: 4px;">
                  <i class="fa-solid fa-camera"></i> Foto Anexada
                </div>
                <div style="position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.7); color: #ffffff; padding: 3px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; pointer-events: none; display: flex; align-items: center; gap: 4px;">
                  <i class="fa-solid fa-magnifying-glass-plus"></i> Ampliar
                </div>
              </div>`
            : `<div style="display: flex; align-items: center; gap: 8px; background: #f8faf8; border: 1px dashed #c8e6c9; border-radius: 10px; padding: 8px 12px; color: #777; font-size: 0.8rem; margin-bottom: 6px;">
                 <i class="fa-regular fa-image" style="color: #a5d6a7; font-size: 1rem;"></i>
                 <span>Sem foto anexada</span>
               </div>`;

          card.innerHTML = `
            ${fotoTag}
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px;">
              <div>
                <strong style="color: var(--verde-escuro, #1b6d24); font-size: 1.08rem;"><i class="fa-solid fa-recycle"></i> ${matNome}</strong> (${item.quantidade || 'Qtd não informada'})
                <div style="font-size: 0.85rem; color: #555; margin-top: 4px;">
                  <span><strong>Ofertante:</strong> ${cidNome}${cidTel}</span> | <span><strong>Ponto de Retirada:</strong> ${localNome}</span>
                </div>
                <div style="font-size: 0.78rem; color: var(--cinza-texto-aux); margin-top: 2px;">
                  Status Atual: <strong style="color: #1b6d24; text-transform: uppercase;">${stNome}</strong> | Data de Cadastro: ${new Date(item.criado_em).toLocaleDateString('pt-BR')}
                </div>
              </div>
            </div>

            <!-- Seletores de Vincular Catador e Alterar Status -->
            <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; background: #f9fbf9; padding: 12px 14px; border-radius: 10px; border: 1px solid #e8f5e9;">
              <div style="display: flex; flex-direction: column; flex: 1; min-width: 220px;">
                <label style="font-size: 0.78rem; font-weight: 800; color: var(--verde-escuro, #1b6d24); margin-bottom: 4px; display: flex; align-items: center; gap: 4px;">
                  <i class="fa-solid fa-user-check"></i> Catador Atribuído:
                </label>
                <select class="select-vincular-catador" data-id="${item.cod_coleta || item.id}" ${disabledCatador} style="font-size: 0.88rem; ${styleCatador}">
                  ${catadorOptionsHtml}
                </select>
                ${fraseBloqueio ? `<span style="font-size: 0.75rem; color: #c62828; font-weight: 600; margin-top: 5px; display: flex; align-items: center; gap: 4px;"><i class="fa-solid fa-lock" style="font-size: 0.7rem;"></i> ${fraseBloqueio}</span>` : ''}
              </div>

              <div style="display: flex; flex-direction: column; min-width: 160px;">
                <label style="font-size: 0.78rem; font-weight: 800; color: var(--verde-escuro, #1b6d24); margin-bottom: 4px; display: flex; align-items: center; gap: 4px;">
                  <i class="fa-solid fa-list-check"></i> Status da Coleta:
                </label>
                <select class="select-status-coleta" data-id="${item.cod_coleta || item.id}" style="font-size: 0.88rem;">
                  ${statusOptionsHtml}
                </select>
              </div>
            </div>
          `;
          container.appendChild(card);
        });

        document.querySelectorAll('.img-preview-material').forEach(img => {
          img.addEventListener('click', (e) => {
            const src = e.currentTarget.getAttribute('data-src') || e.currentTarget.src;
            const alt = e.currentTarget.getAttribute('alt');
            abrirModalFoto(src, alt);
          });
        });

        // Eventos de alteração de catador vinculado
        document.querySelectorAll('.select-vincular-catador').forEach(sel => {
          sel.addEventListener('change', async () => {
            const id = sel.dataset.id;
            const catadorId = sel.value;
            try {
              await vincularCatadorColeta(id, catadorId);
              statusMsg.className = 'status-message success';
              statusMsg.textContent = 'Catador vinculado à coleta com sucesso!';
              carregarColetas(filtroStatus);
            } catch (err) {
              statusMsg.className = 'status-message error';
              statusMsg.textContent = 'Erro ao vincular catador: ' + err.message;
            }
          });
        });

        // Eventos de alteração de status
        document.querySelectorAll('.select-status-coleta').forEach(sel => {
          sel.addEventListener('change', async () => {
            const id = sel.dataset.id;
            const novoCodStatus = parseInt(sel.value, 10);
            const { error } = await supabase.from('coleta').update({ cod_status: novoCodStatus, atualizado_em: new Date().toISOString() }).eq('cod_coleta', id);
            if (error) {
              statusMsg.className = 'status-message error';
              statusMsg.textContent = 'Erro ao atualizar status: ' + error.message;
            } else {
              statusMsg.className = 'status-message success';
              statusMsg.textContent = 'Status da coleta atualizado com sucesso!';
              carregarColetas(filtroStatus);
            }
          });
        });

      } catch (err) {
        console.error('Erro ao carregar coletas:', err);
        container.innerHTML = `<div class="status-message error">Erro ao carregar coletas: ${err.message}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (btnVoltarTop) {
        btnVoltarTop.addEventListener('click', (e) => {
          e.preventDefault();
          window.location.href = './dashboard-admin.html';
        });
      }

      document.querySelectorAll('#filtros_coletas button').forEach(b => {
        b.addEventListener('click', () => {
          document.querySelectorAll('#filtros_coletas button').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          carregarColetas(b.dataset.status);
        });
      });

      const acesso = await protegerRota(['administrador']).catch(() => ({ permitido: false }));
      if (acesso && acesso.permitido) {
        perfilAtual = acesso.perfil;
      }

      await carregarColetas();
    });

    function abrirModalFoto(url, titulo) {
      let modal = document.getElementById('modal-foto-preview');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'modal-foto-preview';
        modal.style.cssText = 'position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px;';
        modal.innerHTML = `
          <div style="position: relative; max-width: 90vw; max-height: 90vh; display: flex; flex-direction: column; align-items: center;">
            <button id="btn-fechar-foto-modal" style="position: absolute; top: -45px; right: 0; background: none; border: none; color: #ffffff; font-size: 1.8rem; cursor: pointer; padding: 8px;">
              <i class="fa-solid fa-xmark"></i>
            </button>
            <img id="img-modal-full" src="" alt="Foto do Material" style="max-width: 100%; max-height: 80vh; object-fit: contain; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <span id="txt-modal-titulo" style="color: #ffffff; margin-top: 12px; font-weight: 700; font-size: 1rem; text-align: center;"></span>
          </div>
        `;
        document.body.appendChild(modal);

        modal.addEventListener('click', (e) => {
          if (e.target === modal || e.target.closest('#btn-fechar-foto-modal')) {
            modal.style.display = 'none';
          }
        });
      }

      const imgFull = modal.querySelector('#img-modal-full');
      const txtTitulo = modal.querySelector('#txt-modal-titulo');
      if (imgFull) imgFull.src = url;
      if (txtTitulo) txtTitulo.textContent = titulo || 'Material Reciclável';
      modal.style.display = 'flex';
    }
  </script>
</body>
</html>
