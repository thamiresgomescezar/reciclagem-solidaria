<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Acesso — Reciclagem Solidária</title>
  <link rel="stylesheet" href="../css/design-tokens.css">
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Menu de Hambúrguer Fixo no Canto Superior Esquerdo -->
  <button type="button" class="top-menu-btn" id="btn_menu_drawer" aria-label="Abrir Menu Principal" title="Menu">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="web-container">
    <!-- Top Header -->
    <div class="top-bar">
      <div></div>
      <div></div>
    </div>

    <div class="main-content">
      <div class="bg-split">
        <div class="bg-left"></div>
        <div class="bg-right"></div>
      </div>

      <div class="content-overlay">
        <!-- 1/4 Esquerda: Logo Fixo no Topo -->
        <aside class="left-panel">
          <div class="links" style="margin-bottom: 0.5rem;">
            <a href="./login.html" class="l1"><i class="fa-solid fa-key"></i> Recuperar Acesso</a>
          </div>

          <div class="logo-wrap">
            <img src="../assets/logo.jpg" alt="Logo Reciclagem Solidária" class="app-logo">
          </div>
        </aside>

        <!-- 2/4 Centro: Orientação de Suporte Direto -->
        <main class="center-panel">
          <div style="width: 100%; max-width: 460px; margin: 0 auto; text-align: center;">
            <div style="width: 64px; height: 64px; background: #e8f5e9; border-radius: 50%; color: var(--verde-escuro, #1b6d24); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 1.85rem;">
              <i class="fa-solid fa-circle-info"></i>
            </div>

            <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--verde-escuro, #1b6d24); margin-bottom: 0.75rem;">
              Recuperação de Senha
            </h1>

            <p style="color: #444; font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px;">
              No momento, a recuperação automática de senha está desabilitada.<br><br>
              Caso tenha perdido ou esquecido sua senha, por favor entre em contato com os <strong>desenvolvedores</strong> ou com a administração da Fatec para restabelecer o seu acesso.
            </p>

            <a href="./login.html" class="btn-avancar" style="text-decoration: none; justify-content: center; width: 100%;">
              <i class="fa-solid fa-arrow-left"></i> Voltar ao Login
            </a>
          </div>
        </main>

        <!-- Right Panel -->
        <aside class="right-panel"></aside>
      </div>
    </div>
  </div>

  <script type="module" src="../js/lib/navMenu.js"></script>
</body>
</html>
