<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Coletas — Reciclagem Solidária</title>
  <link rel="stylesheet" href="../css/design-tokens.css">
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Menu de Hambúrguer Fixo no Canto Superior Esquerdo -->
  <button type="button" class="top-menu-btn" id="btn_menu_drawer" aria-label="Abrir Menu Principal" title="Menu">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="web-container">
    <!-- Top Header -->
    <div class="top-bar">
      <div></div>
      <a href="./dashboard-catador.html" id="btn-voltar-top" style="color: #ffffff !important; font-size: 0.85rem; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 4px;">
        <i class="fa-solid fa-arrow-left"></i> Voltar ao Painel
      </a>
    </div>

    <div class="main-content">
      <div class="bg-split">
        <div class="bg-left"></div>
        <div class="bg-right"></div>
      </div>

      <div class="content-overlay">
        <!-- 1/4 Esquerda: Logo e Navegação -->
        <aside class="left-panel">
          <div class="links">
            <a href="./minhas-coletas.html" class="l1" id="link_left_minhas_coletas"><i class="fa-solid fa-clipboard-check"></i> Minhas Coletas</a>
          </div>

          <div class="logo-wrap" style="margin-top: 0.5rem;">
            <img src="../assets/logo.jpg" alt="Logo Reciclagem Solidária" class="app-logo">
          </div>
        </aside>

        <!-- 2/4 Centro: Histórico do Usuário Simplificado -->
        <main class="center-panel">
          <div style="max-width: 620px; width: 100%; margin: 0 auto; padding-bottom: 2rem;">
            
            <!-- Cabeçalho Simplificado com Ação Direta -->
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 1.5rem; border-bottom: 2px solid #a5d6a7; padding-bottom: 1rem;">
              <div>
                <h1 id="titulo_minhas_coletas" style="font-size: 1.75rem; font-weight: 800; color: var(--verde-escuro, #1b6d24); margin: 0;">
                  Minhas Coletas
                </h1>
                <p id="subtitulo_minhas_coletas" style="font-size: 0.88rem; color: #555; margin-top: 2px; margin-bottom: 0;">
                  Acompanhamento e histórico de materiais recicláveis
                </p>
              </div>

              <a href="./inserir-material.html" id="btn_top_acao" class="btn-acao-primaria" style="width: auto; text-decoration: none;">
                <i class="fa-solid fa-plus"></i> Nova Oferta
              </a>
            </div>

            <div id="feedback-msg" class="status-message"></div>

            <!-- Toolbar de Filtros por Status da Coleta Dinâmica Instantânea -->
            <div id="filtros_status_coletas" class="filtros-coletas-grid">
              <button type="button" class="btn-tab active" data-filtro="todos"><i class="fa-solid fa-layer-group"></i> Todas</button>
              <button type="button" class="btn-tab" data-filtro="disponível" data-cor="verde"><i class="fa-solid fa-clock"></i> Disponíveis</button>
              <button type="button" class="btn-tab" data-filtro="agendada" data-cor="amarelo"><i class="fa-solid fa-calendar-check"></i> Agendadas</button>
              <button type="button" class="btn-tab" data-filtro="reagendada" data-cor="amarelo"><i class="fa-solid fa-calendar-days"></i> Reagendadas</button>
              <button type="button" class="btn-tab" data-filtro="retirada" data-cor="verde"><i class="fa-solid fa-circle-check"></i> Retiradas</button>
              <button type="button" class="btn-tab" data-filtro="cancelada" data-cor="vermelho"><i class="fa-solid fa-ban"></i> Canceladas</button>
            </div>
            <script>
              (function() {
                try {
                  var raw = localStorage.getItem('reciclagem_lista_status');
                  var container = document.getElementById('filtros_status_coletas');
                  if (raw && container) {
                    var list = JSON.parse(raw);
                    if (Array.isArray(list) && list.length > 0) {
                      var tipoUsuario = localStorage.getItem('reciclagem_tipo_usuario') || sessionStorage.getItem('reciclagem_tipo_usuario');
                      if (tipoUsuario === 'catador') {
                        list = list.filter(function(st) {
                          var s = (st.status || '').toLowerCase().trim();
                          return st.cod_status !== 1 && !/dispon/i.test(s);
                        });
                      }
                      var urlParams = new URLSearchParams(window.location.search);
                      var f = (urlParams.get('status') || urlParams.get('filtro') || 'todos').toLowerCase();
                      var h = '<button type="button" class="btn-tab ' + (f === 'todos' ? 'active' : '') + '" data-filtro="todos" data-status="todos"><i class="fa-solid fa-layer-group"></i> Todas</button>';
                      list.forEach(function(st) {
                        var cod = st.cod_status;
                        var stNome = (st.status || '').toLowerCase().trim();
                        var regras = st.regras || {};
                        var icon = regras.icone;
                        var disp = st.status.charAt(0).toUpperCase() + st.status.slice(1);
                        var corId = (regras && regras.cor) ? regras.cor : (cod === 4 || cod === 5 || /cancel/i.test(stNome) ? 'vermelho' : /agend/i.test(stNome) ? 'amarelo' : 'verde');
                        if (/cancel/i.test(stNome) || cod === 4 || cod === 5) {
                          icon = 'fa-ban';
                          disp = 'Canceladas';
                        } else if (!icon) {
                          if (/(retirad|conclu)/i.test(stNome)) { icon = 'fa-circle-check'; disp = 'Retiradas'; }
                          else if (/reagend/i.test(stNome)) { icon = 'fa-calendar-days'; disp = 'Reagendadas'; }
                          else if (/agend/i.test(stNome)) { icon = 'fa-calendar-check'; disp = 'Agendadas'; }
                          else if (/dispon/i.test(stNome)) { icon = 'fa-box-open'; disp = 'Disponíveis'; }
                          else { icon = 'fa-tag'; }
                        } else {
                          if (/(retirad|conclu)/i.test(stNome)) disp = 'Retiradas';
                          else if (/reagend/i.test(stNome)) disp = 'Reagendadas';
                          else if (/agend/i.test(stNome)) disp = 'Agendadas';
                          else if (/dispon/i.test(stNome)) disp = 'Disponíveis';
                          else if (/cancel/i.test(stNome)) disp = 'Canceladas';
                        }
                        var active = (f === String(cod)) || (f === stNome) ||
                          (f === 'disponivel' && /dispon/i.test(stNome)) ||
                          (f === 'cancelada' && /cancel/i.test(stNome)) ||
                          (f === 'retirada' && /(retirad|conclu)/i.test(stNome)) ||
                          (f === 'agendada' && /agend/i.test(stNome));
                        h += '<button type="button" class="btn-tab ' + (active ? 'active' : '') + '" data-filtro="' + cod + '" data-status="' + cod + '" data-cor="' + corId + '" title="' + st.status + '"><i class="fa-solid ' + icon + '"></i> <span>' + disp + '</span></button>';
                      });
                      container.innerHTML = h;
                    }
                  }
                } catch(e) {}
              })();
            </script>

            <!-- Lista de Coletas -->
            <div id="lista-minhas-coletas" style="display: flex; flex-direction: column; gap: 12px;">
              <div style="text-align: center; padding: 30px; color: #666; font-size: 0.95rem;">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Carregando suas ofertas...
              </div>
            </div>

          </div>
        </main>

        <!-- Right Panel -->
        <aside class="right-panel"></aside>
      </div>
    </div>
  </div>

  <script type="module" src="../js/lib/navMenu.js"></script>
  <script type="module" src="../js/pages/minhasColetas.js"></script>
  <script type="module">
    import { getPerfilAtual } from '../js/services/auth.js';
    async function initVoltar() {
      const btnVoltarTop = document.getElementById('btn-voltar-top');
      if (!btnVoltarTop) return;
      try {
        const perfil = await getPerfilAtual();
        if (perfil?.tipo) {
          btnVoltarTop.href = perfil.tipo === 'administrador' ? './dashboard-admin.html' : (perfil.tipo === 'catador' ? './dashboard-catador.html' : './dashboard-cidadao.html');
        }
      } catch (e) {}
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initVoltar);
    } else {
      initVoltar();
    }
  </script>
</body>
</html>
