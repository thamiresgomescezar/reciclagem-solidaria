<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha — Reciclagem Solidária</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="web-container">
    <div class="web-panel-left">
      <button class="top-menu-btn" title="Menu">?</button>

      <div style="margin-top: 60px; text-align: center;">
        <img src="../assets/prototypes/logo.jpg" alt="Logo" class="app-logo" style="max-width: 200px;">
        <h3 style="color: var(--verde-escuro); margin-top: 10px;">Recuperação de Senha</h3>
        <p style="color: var(--cinza-texto-aux); font-size: 14px; margin-top: 4px;">Informe seu e-mail cadastrado para receber as instruções.</p>
      </div>

      <div id="feedback-msg" class="feedback-msg"></div>

      <form id="reset-form" style="max-width: 380px; margin: 30px auto 0 auto; width: 100%;">
        <div class="form-group">
          <label class="form-label" for="email">E-mail Cadastrado</label>
          <input type="email" id="email" class="input-pill" placeholder="seuemail@exemplo.com" required>
        </div>

        <button type="submit" id="btn-reset" class="btn-pill">ENVIAR INSTRUÇÕES</button>
      </form>

      <div style="text-align: center; margin-top: 30px; font-size: 14px;">
        <a href="./login.html" style="font-weight: bold; color: var(--verde-escuro);">Voltar para o Login</a>
      </div>

      <div class="social-icons">
        <a href="#" class="social-icon" title="Instagram"></a>
        <a href="#" class="social-icon" title="Facebook"></a>
      </div>
    </div>

    <div class="web-panel-right"></div>
  </div>

  <script type="module">
    import { resetPassword } from '../js/services/auth.js';

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('reset-form');
      const feedbackMsg = document.getElementById('feedback-msg');
      const btnReset = document.getElementById('btn-reset');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        feedbackMsg.style.display = 'none';

        const email = document.getElementById('email').value.trim();

        try {
          btnReset.disabled = true;
          btnReset.innerText = 'ENVIANDO...';

          await resetPassword(email);

          feedbackMsg.textContent = 'E-mail de redefinição enviado! Verifique sua caixa de entrada.';
          feedbackMsg.className = 'feedback-msg success';
        } catch (err) {
          console.error(err);
          feedbackMsg.textContent = err.message || 'Erro ao enviar e-mail de redefinição.';
          feedbackMsg.className = 'feedback-msg error';
          btnReset.disabled = false;
          btnReset.innerText = 'ENVIAR INSTRUÇÕES';
        }
      });
    });
  </script>
</body>
</html>
