<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inserir Material — Reciclagem Solidária</title>
  <link rel="stylesheet" href="../css/design-tokens.css">
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Menu de Hambúrguer Fixo no Canto Superior Esquerdo -->
  <button type="button" class="top-menu-btn" id="btn_menu_drawer" aria-label="Abrir Menu Principal" title="Menu">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="web-container">
    <!-- Top Header com Botão de Voltar em Branco -->
    <div class="top-bar">
      <div></div>
      <a href="#" id="btn-voltar-top" style="color: #ffffff !important; font-size: 0.85rem; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 4px;">
        <i class="fa-solid fa-arrow-left"></i> Voltar ao Painel
      </a>
    </div>

    <div class="main-content">
      <div class="bg-split">
        <div class="bg-left"></div>
        <div class="bg-right"></div>
      </div>

      <div class="content-overlay">
        <!-- 1/4 Esquerda: Logo e Navegação -->
        <aside class="left-panel">
          <div class="links">
            <a href="./inserir-material.html" class="l1"><i class="fa-solid fa-circle-plus"></i> Inserir Material</a>
          </div>

          <div class="logo-wrap" style="margin-top: 0.5rem;">
            <img src="../assets/logo.jpg" alt="Logo Reciclagem Solidária" class="app-logo">
          </div>
        </aside>

        <!-- 2/4 Centro: Formulário de Inserir Material Alinhado no Topo -->
        <main class="center-panel">
          <div style="width: 100%; padding-bottom: 2rem;">
            <h1 style="font-size: 2rem; font-weight: 800; color: var(--verde-escuro, #1b6d24); text-align: center; margin-bottom: 1.25rem; margin-top: 0;">
              Inserir Material
            </h1>

            <form id="oferta-form" novalidate style="width: 100%;">
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="campo">
                  <label for="cod_material">Tipo de Material Reciclável:<span class="req">*</span></label>
                  <select id="cod_material" required>
                    <option value="">-- Selecione o Tipo de Material --</option>
                  </select>
                </div>

                <div class="campo">
                  <label for="quantidade_numero">Quantidade Aproximada:<span class="req">*</span></label>
                  <div class="grid-qtd-inline" style="display: grid; grid-template-columns: 75px 1fr; gap: 8px; width: 100%;">
                    <input type="number" id="quantidade_numero" class="input-underline" min="1" max="9999" value="1" placeholder="1" required style="width: 100%; text-align: center; font-weight: 700;">
                    <select id="quantidade_unidade" class="input-underline" required style="width: 100%; font-weight: 600; cursor: pointer;">
                      <option value="saco(s) grande(s)">saco(s) grande(s)</option>
                      <option value="saco(s) médio(s)">saco(s) médio(s)</option>
                      <option value="caixa(s)" selected>caixa(s)</option>
                      <option value="sacola(s)">sacola(s)</option>
                      <option value="pacote(s)">pacote(s)</option>
                      <option value="kg">kg (quilos)</option>
                      <option value="unidade(s)">unidade(s)</option>
                      <option value="fardo(s)">fardo(s)</option>
                      <option value="outro">Outro (especificar)</option>
                    </select>
                  </div>
                  <div id="box-unidade-outro" style="display: none; margin-top: 6px;">
                    <input type="text" id="quantidade_outro" class="input-underline" placeholder="Especifique a unidade (ex: tambores, baldes)" style="width: 100%; font-size: 0.85rem;">
                  </div>
                </div>
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 1rem;">
                <div class="campo">
                  <label for="foto">Foto do Material (Opcional):</label>
                  <input type="file" id="foto" class="input-underline" accept="image/*" style="width: 100%;">
                  <div id="box-preview-foto" style="display: none; margin-top: 10px; position: relative; width: fit-content;">
                    <img id="img-preview-inserir" src="" alt="Prévia da Foto" style="max-width: 140px; max-height: 140px; object-fit: cover; border-radius: 10px; border: 2px solid #a5d6a7; box-shadow: 0 4px 10px rgba(0,0,0,0.08);">
                    <button type="button" id="btn-remover-foto" style="position: absolute; top: -8px; right: -8px; background: #c62828; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.2);" title="Remover Foto">✕</button>
                    <span id="lbl-foto-nome" style="display: block; font-size: 0.75rem; color: #555; margin-top: 4px; font-weight: 600;"></span>
                  </div>
                </div>

                <div class="campo">
                  <label for="local_retirada_id">Ponto de Coleta / Retirada:<span class="req">*</span></label>
                  <select id="local_retirada_id" required>
                    <option value="">-- Selecione o Ponto de Retirada --</option>
                  </select>
                </div>
              </div>

              <!-- Painel de Confirmação dos Dias e Horários de Atendimento da Unidade -->
              <div id="box-confirmacao-agenda" style="display: none; margin-top: 1.25rem; background: #f8faf8; border: 1.5px solid #a5d6a7; border-radius: 14px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.03);">
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; border-bottom: 1px solid #e8f5e9; padding-bottom: 6px;">
                  <strong style="color: var(--verde-escuro, #1b6d24); font-size: 0.92rem; display: flex; align-items: center; gap: 6px;">
                    <i class="fa-regular fa-calendar-check"></i> Dias & Horários para Retirada na Unidade
                  </strong>
                </div>

                <div id="conteudo-agenda-resumo" style="font-size: 0.83rem; color: #444; margin-bottom: 10px; line-height: 1.4;">
                  <i class="fa-solid fa-circle-notch fa-spin"></i> Consultando agenda de atendimento da unidade...
                </div>

                <div style="background: #e8f5e9; padding: 10px 12px; border-radius: 8px; border: 1px solid #c8e6c9;">
                  <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 700; color: #1b6d24;">
                    <input type="checkbox" id="check-confirmar-agenda" checked style="width: 18px; height: 18px; accent-color: #1b6d24; cursor: pointer; margin-top: 2px;">
                    <span>Confirmo que a unidade estará aberta nestes horários para atendimento aos catadores</span>
                  </label>
                  <div style="font-size: 0.78rem; color: #4a5568; margin-top: 4px; padding-left: 26px; font-weight: 500; line-height: 1.3;">
                    <i class="fa-solid fa-circle-info" style="color: #2e7d32;"></i> Se não, entre em contato com um dos administradores para atualizar a agenda.
                  </div>
                </div>
              </div>

              <button type="submit" id="btn-enviar" class="btn-avancar" style="margin-top: 1.5rem; width: 100%;">
                <i class="fa-solid fa-cloud-arrow-up"></i> CADASTRAR MATERIAL
              </button>

              <div id="feedback-msg" class="status-message" style="margin-top: 1rem;"></div>
            </form>
          </div>
        </main>

        <!-- Right Panel -->
        <aside class="right-panel"></aside>
      </div>
    </div>
  </div>

  <script type="module" src="../js/lib/navMenu.js"></script>
  <script type="module" src="../js/pages/inserirMaterial.js"></script>
  <script type="module">
    import { getPerfilAtual } from '../js/services/auth.js';
    document.addEventListener('DOMContentLoaded', async () => {
      const btnVoltarTop = document.getElementById('btn-voltar-top');
      const perfil = await getPerfilAtual();
      if (perfil?.tipo) {
        btnVoltarTop.href = perfil.tipo === 'administrador' ? './dashboard-admin.html' : (perfil.tipo === 'catador' ? './dashboard-catador.html' : './dashboard-cidadao.html');
      }
    });
  </script>
</body>
</html>
