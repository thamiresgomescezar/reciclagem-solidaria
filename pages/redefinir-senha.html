<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha — Reciclagem Solidária</title>
  <link rel="stylesheet" href="../css/design-tokens.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--surface, #f5fbef);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      position: relative;
      overflow: hidden;
    }
    .header-curve {
      background: linear-gradient(135deg, #a5d6a7, #4caf50);
      border-bottom-left-radius: 50% 20%;
      border-bottom-right-radius: 50% 20%;
      color: white;
      padding: 1.5rem 1rem 4rem;
      text-align: center;
      position: relative;
      z-index: 10;
    }
    .header-curve h1 { font-size: 1.8rem; font-weight: 800; margin: 0; }
    .header-curve .sub { font-size: 0.9rem; font-weight: 600; opacity: 0.95; margin-top: 0.25rem; }
    main {
      flex: 1;
      padding: 0 1.5rem 3rem;
      max-width: 430px;
      width: 100%;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      margin-top: -2rem;
    }
    .card-form {
      background: white;
      border-radius: 1.5rem;
      padding: 1.75rem 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.05);
    }
    .campo { margin-bottom: 1rem; }
    .campo label { display: block; color: var(--verde-700, #347535); font-weight: 700; font-size: 0.9rem; margin-bottom: 0.35rem; }
    .campo label .req { color: #ff5252; }
    .campo input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--verde-300, #addb95);
      padding: 6px 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      color: var(--verde-700, #347535);
      outline: none;
      border-radius: 0;
    }
    .campo input:focus { border-bottom-color: var(--verde-600, #3f933f); }
    .btn-pill {
      width: 100%;
      background: linear-gradient(180deg, #81c784, #4caf50);
      border: none;
      border-radius: 999px;
      padding: 13px;
      color: white;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    .btn-pill:hover { opacity: 0.9; }
    .btn-pill:disabled { opacity: 0.6; cursor: not-allowed; }
    .status-message { margin-bottom: 0.75rem; }
  </style>
</head>
<body>
  <header class="header-curve">
    <h1>Redefinir Senha</h1>
    <div class="sub">Digite sua nova senha de 6 dígitos</div>
  </header>

  <main>
    <div class="card-form">
      <div class="status-message" id="statusMsg"></div>
      <form id="formRedefinir" novalidate>
        <div class="campo">
          <label for="senha">Nova senha (6 dígitos):<span class="req">*</span></label>
          <input type="password" id="senha" maxlength="6" inputmode="numeric" placeholder="••••••" autocomplete="new-password">
        </div>
        <div class="campo">
          <label for="senha2">Confirme a nova senha:<span class="req">*</span></label>
          <input type="password" id="senha2" maxlength="6" inputmode="numeric" placeholder="••••••" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-pill" id="btnSalvar">Salvar nova senha</button>
      </form>
    </div>
  </main>

  <script type="module">
    import { supabase } from '../js/lib/supabaseClient.js';

    const form = document.getElementById('formRedefinir');
    const statusMsg = document.getElementById('statusMsg');
    const btn = document.getElementById('btnSalvar');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusMsg.className = 'status-message';

      const senha = document.getElementById('senha').value;
      const senha2 = document.getElementById('senha2').value;

      if (senha.length !== 6 || !/^\d{6}$/.test(senha)) {
        statusMsg.className = 'status-message error';
        statusMsg.textContent = 'A senha deve ter exatamente 6 dígitos numéricos.';
        return;
      }
      if (senha !== senha2) {
        statusMsg.className = 'status-message error';
        statusMsg.textContent = 'As senhas não coincidem.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Salvando...';
      const { error } = await supabase.auth.updateUser({ password: senha });
      if (error) {
        statusMsg.className = 'status-message error';
        statusMsg.textContent = error.message;
        btn.disabled = false;
        btn.textContent = 'Salvar nova senha';
        return;
      }
      statusMsg.className = 'status-message success';
      statusMsg.textContent = 'Senha atualizada com sucesso! Redirecionando...';
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    });
  </script>
</body>
</html>
