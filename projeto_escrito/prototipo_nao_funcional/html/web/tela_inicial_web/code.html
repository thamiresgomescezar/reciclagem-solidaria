<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Reciclagem Solidária - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            primary: {
              DEFAULT: '#4caf50',
              50: '#f5fbee',
              100: '#e8f6df',
              200: '#d0ebc0',
              300: '#addb95',
              400: '#83c464',
              500: '#4caf50',
              600: '#3f933f',
              700: '#347535',
              800: '#2c5d2d',
              900: '#254c27',
              950: '#112913',
            },
            surface: '#f5fbef',
            'surface-dim': '#d6dcd0',
            'surface-bright': '#f5fbef',
          },
          borderRadius: {
            'xl': '0.75rem',
            '2xl': '1rem',
            '3xl': '1.5rem',
          }
        }
      }
    }
  </script>
<style data-purpose="layout">
    body {
        background-color: #d6dcd0; /* surface-dim */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 1rem;
    }
    .app-container {
        position: relative;
        width: 100%;
        max-width: 1200px;
        aspect-ratio: 16/10;
        background-color: white;
        border-radius: 0.5rem;
        overflow: hidden;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        display: flex;
        flex-direction: column;
    }
    /* Top Bar */
    .top-bar {
        height: 40px;
        background: linear-gradient(to right, #e0e0e0, #888, #4caf50);
        display: flex;
        align-items: center;
        padding: 0 1rem;
        position: relative;
        z-index: 10;
    }
    .main-content {
        flex: 1;
        display: flex;
        position: relative;
        overflow: hidden;
    }
    /* Slanted Background Split */
    .bg-split {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        z-index: 0;
    }
    .bg-left {
        width: 75%;
        background-color: white;
        position: relative;
    }
    .bg-right {
        width: 25%;
        background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuACwBas2cj5S4pJvTuszufM-lY5zfW4e9jY1-DUlIgp3wVXeSHVaU0EZ_gnZsjKE7aN7oqjiGODSsMlKzreIzNgTB-_6bnyUs3SM6v4zkiX95pXjbkPl-XPA8r2L7rP9uSxa783Ccl_rtbXr2uk9zl9nyVC0vgC6HbXIv5mUsfqRriz_mPs5JqeV5edpb8p7ba7uRkhnO8L2hQqG2-LOVYN1KmM3OxDQcD7Yrvk-zsmD94QG4az6aOkpw');
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        position: relative;
    }
    .bg-right::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(76, 175, 80, 0.7);
    }
    /* Content Overlay */
    .content-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1;
        display: flex;
        padding: 2rem;
    }
    .left-panel {
        width: 30%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
    }
    /* Curved background for logo area */
    .left-panel::before {
        content: "";
        position: absolute;
        top: -2rem;
        left: -2rem;
        bottom: -2rem;
        width: 120%;
        background-color: #e8f6df;
        border-radius: 0 50% 50% 0;
        z-index: -1;
    }
    .center-panel {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: auto auto auto;
        gap: 1.5rem;
        padding: 0 2rem;
        align-content: start;
    }
    .right-panel {
        width: 25%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        padding-bottom: 2rem;
    }
    /* Footer */
    .bottom-bar {
        height: 50px;
        background-color: #2c5d2d; /* primary-800 */
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 0 2rem;
        position: relative;
        z-index: 10;
    }
    /* Action Cards */
    .action-card {
        background-color: #e8f6df; /* primary-100 */
        border-radius: 1.5rem;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        transition: transform 0.2s;
        cursor: pointer;
    }
    .action-card:hover {
        transform: translatey(-2px);
    }
    .action-icon-wrapper {
        width: 60px;
        height: 60px;
        background-color: white;
        border: 3px solid #4caf50;
        border-radius: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 0.75rem;
        position: relative;
    }
    .icon-badge {
        position: absolute;
        bottom: -5px;
        right: -5px;
        background-color: #4caf50;
        color: white;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        border: 2px solid white;
    }
</style>
</head>
<body>
<!-- BEGIN: AppContainer -->
<div class="app-container">
<!-- BEGIN: TopBar -->
<div class="top-bar">
<button class="text-primary-500 hover:text-primary-600 focus:outline-none">
<i class="fa-solid fa-bars text-2xl"></i>
</button>
</div>
<!-- END: TopBar -->
<!-- BEGIN: MainContent -->
<div class="main-content">
<!-- Background Split -->
<div class="bg-split">
<div class="bg-left"></div>
<div class="bg-right" style="background-image: url(&quot;https://lh3.googleusercontent.com/aida/AP1WRLuoNwo--KoXqOmhiCppft4M2ABCQO_wLN4pA6uSCIB58lq3mnGLP-rOc2fhqP_cne7RU3eRAKwEuKaB6Znie1r56UBZS_vDcwP1QV-pV5ITViPBtS_IsWC3OBa0dYof26-_5JcKPdqzNJPQzA15bN3ZZIQuIGMNgRPb-Wboq0I1CvPJD3fPo9lu4ozCD-fm3TsO_NM-Lt05eixBwmap6QaGN5LCs3yPelXG1o6qA-awMPd-9Zl2UqxRjJEm&quot;); background-position: 70% center; background-size: cover;"></div>
</div>
<!-- Content Overlay -->
<div class="content-overlay">
<!-- BEGIN: LeftPanel (Logo & Welcome) -->
<div class="left-panel">
<div>
<a class="text-primary-600 font-semibold flex items-center gap-2 hover:text-primary-700" href="#">
              Quem somos <i class="fa-solid fa-leaf"></i>
</a>
<a class="text-primary-500 font-semibold block mt-1 hover:text-primary-600" href="#">
              Saiba mais
            </a>
</div>
<div class="flex-1 flex items-center justify-center">
<img alt="Reciclagem Solidária Logo" class="max-w-full max-h-64 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBp1hGaaxbveoWyyPxalp17y12uB7c440n1Ixfe-Ch7GR9kPvXHRGyO8DvGog3-y6YepwmPn2GVah16JRuwHwYWwCkLcg15YCYUW5E6e2KK357RR-5nWAG8GefCyprjYSmXrYm8jnuD5-aNSN7DeZXQqZHwDFtCsDiCtUH-_9mySx-0kMaeFm616ufNRzySSn_MoRtluomJSQlzzj1kTd_RiGOIg53MZaSKTb-h3f6I-GBzTDfgLawDRRBJa8jetUAerjc">
</div>
<div class="flex flex-col gap-3">
<button class="w-full bg-primary-500 hover:bg-primary-600 text-white font-bold py-3 px-8 rounded-full text-xl shadow-lg transition-colors">
        Login
    </button>
<div class="bg-[#81c784] text-white p-3 rounded-xl text-center w-full shadow-md text-sm">
<p class="font-bold">Primeiro acesso?</p>
<p class="">Faça seu cadastro. <a class="underline font-bold text-xs ml-1" href="#">clique aqui</a></p>
</div>
</div>
</div>
<!-- END: LeftPanel -->
<!-- BEGIN: CenterPanel (Action Grid) -->
<div class="center-panel">
<!-- Inserir material -->
<div class="action-card">
<div class="action-icon-wrapper">
<i class="fa-solid fa-trash-can text-3xl text-gray-700"></i>
<div class="absolute inset-0 flex justify-center items-center pointer-events-none">
<div class="w-1 h-6 bg-red-500 absolute -translate-x-3"></div>
<div class="w-1 h-6 bg-yellow-500 absolute"></div>
<div class="w-1 h-6 bg-blue-500 absolute translate-x-3"></div>
</div>
<div class="icon-badge"><i class="fa-solid fa-plus"></i></div>
</div>
<span class="text-primary-700 font-bold text-sm leading-tight">Inserir material<br>para retirada</span>
</div>
<!-- Contatar Catador -->
<div class="action-card">
<div class="action-icon-wrapper !border-none !bg-transparent">
<i class="fa-solid fa-recycle text-5xl text-primary-500 relative">
<i class="fa-solid fa-comment absolute -top-2 -right-2 text-2xl text-blue-500"></i>
</i>
</div>
<span class="text-primary-700 font-bold text-sm leading-tight">Contatar<br>Catador</span>
</div>
<!-- Editar material -->
<div class="action-card">
<div class="action-icon-wrapper">
<i class="fa-solid fa-trash-can text-3xl text-gray-400"></i>
<div class="icon-badge"><i class="fa-solid fa-pen"></i></div>
</div>
<span class="text-primary-700 font-bold text-sm leading-tight">Editar material<br>para retirada</span>
</div>
<!-- Usuários Cadastrados -->
<div class="action-card">
<div class="flex flex-col items-center">
<i class="fa-solid fa-users text-5xl text-primary-600 mb-2"></i>
<span class="text-primary-700 font-bold text-sm leading-tight text-center">Usuários<br>Cadastrados</span>
</div>
</div>
<!-- Agenda -->
<div class="col-span-1 flex flex-col items-center justify-center">
<h3 class="text-pink-400 font-bold text-2xl mb-2 flex items-center gap-1">Agenda <i class="fa-solid fa-caret-down text-sm text-primary-500"></i></h3>
<div class="action-card w-full">
<i class="fa-regular fa-calendar-check text-4xl text-primary-600 mb-2 relative">
<i class="fa-regular fa-clock absolute -bottom-1 -right-2 text-lg bg-white rounded-full text-primary-700"></i>
</i>
<span class="text-primary-700 font-bold text-sm leading-tight">Calendário<br>para retirada</span>
</div>
</div>
<!-- Editar Local -->
<div class="col-span-1 flex flex-col justify-end items-center"><div class="action-card w-full">
<div class="flex flex-col items-center">
<i class="fa-solid fa-location-dot text-5xl text-primary-700 mb-2 relative">
<i class="fa-solid fa-recycle absolute top-2 left-1/2 -translate-x-1/2 text-white text-sm"></i>
</i>
<span class="text-primary-700 font-bold text-sm leading-tight text-center">Editar<br>Local da<br>Retirada</span>
</div>
</div></div>
</div>
<!-- END: CenterPanel -->
<!-- BEGIN: RightPanel (Relatórios) -->
<div class="right-panel">
<div class="text-white bg-black/50 px-2 py-0.5 rounded text-lg font-bold mb-2 flex items-center gap-1 backdrop-blur-sm cursor-pointer hover:bg-black/60 transition-colors">
             Relatórios <i class="fa-solid fa-caret-down text-sm"></i>
</div>
<i class="fa-solid fa-recycle text-6xl text-primary-500 drop-shadow-lg opacity-90 hover:text-primary-600 transition-colors cursor-pointer"></i>
</div>
<!-- END: RightPanel -->
</div>
</div>
<!-- END: MainContent -->
<!-- BEGIN: BottomBar -->
<div class="bottom-bar">
</div>
<!-- END: BottomBar -->
</div>
<!-- END: AppContainer -->




</body></html>
